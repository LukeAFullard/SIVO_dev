<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #0f172a; }
            .tier { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.2); stroke-width: 2px; transition: all 0.3s ease; cursor: pointer; }
            .tier:hover { fill: rgba(255,255,255,0.15); stroke: rgba(57, 255, 20, 0.8); }
            .bento { fill: rgba(15,23,42,0.6); stroke: rgba(255,255,255,0.1); stroke-width: 1px; rx: 12px; }
            .text-main { fill: #f8fafc; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; alignment-baseline: middle; }
        </style>
    </defs>

    <!-- Background -->
    <rect class="bg" width="100%" height="100%"/>

    <!-- Title Area -->
    <text x="600.0" y="64.0" class="text-main" font-size="32px" id="main-title">Layered Pyramid Architecture</text>
    <text x="600.0" y="96.0" class="text-main" font-size="16px" fill="#94a3b8" id="sub-title">Data Funnel &amp; Conversions</text>

    <!-- Bento Boxes -->
    <rect id="bento-1" class="bento" x="60.0" y="80.0" width="240.0" height="280.0" />
    <rect id="bento-2" class="bento" x="60.0" y="400.0" width="240.0" height="320.0" />
    <rect id="bento-3" class="bento" x="900.0" y="80.0" width="240.0" height="280.0" />
    <rect id="bento-4" class="bento" x="900.0" y="400.0" width="240.0" height="320.0" />

    <!-- Pyramid Tiers -->
    <polygon id="tier-1" class="tier" points="600.0,160.0 600.0,160.0 660.0,280.0 540.0,280.0" />
    <polygon id="tier-2" class="tier" points="540.0,280.0 660.0,280.0 720.0,400.0 480.0,400.0" />
    <polygon id="tier-3" class="tier" points="480.0,400.0 720.0,400.0 780.0,520.0 420.0,520.0" />
    <polygon id="tier-4" class="tier" points="420.0,520.0 780.0,520.0 840.0,640.0 360.0,640.0" />

    <!-- Text overlays on pyramid -->
    <text x="600.0" y="232.0" class="text-main" id="text-tier-1">Tier 1</text>
    <text x="600.0" y="340.0" class="text-main" id="text-tier-2">Tier 2</text>
    <text x="600.0" y="460.0" class="text-main" id="text-tier-3">Tier 3</text>
    <text x="600.0" y="580.0" class="text-main" id="text-tier-4">Tier 4</text>
</svg>