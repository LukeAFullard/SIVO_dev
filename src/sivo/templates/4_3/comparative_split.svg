<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
    <!-- Base Background -->
    <rect id="background" width="1200" height="900" fill="#ffffff" />

    <!-- Title -->
    <text id="dash_title" x="600" y="70" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#333333" text-anchor="middle">Comparative Split</text>
    <text id="dash_subtitle" x="600" y="110" font-family="sans-serif" font-size="22px" fill="#666666" text-anchor="middle">Subtitle</text>

    <!-- Panel A (Left) -->
    <g id="panel_a">
        <rect id="bg_panel_a" x="40" y="160" width="520" height="700" fill="#f0f0f0" rx="16" />
        <text id="title_panel_a" x="300" y="220" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#333333" text-anchor="middle">Option A</text>
        <rect id="chart_a" x="80" y="280" width="440" height="400" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_a" x="300" y="760" font-family="sans-serif" font-size="18px" fill="#666666" text-anchor="middle">Description A</text>
    </g>

    <!-- Divider -->
    <line x1="600" y1="160" x2="600" y2="860" stroke="#cccccc" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="600" cy="510" r="28" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    <text x="600" y="520" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#333333" text-anchor="middle">VS</text>

    <!-- Panel B (Right) -->
    <g id="panel_b">
        <rect id="bg_panel_b" x="640" y="160" width="520" height="700" fill="#f0f0f0" rx="16" />
        <text id="title_panel_b" x="900" y="220" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#333333" text-anchor="middle">Option B</text>
        <rect id="chart_b" x="680" y="280" width="440" height="400" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_b" x="900" y="760" font-family="sans-serif" font-size="18px" fill="#666666" text-anchor="middle">Description B</text>
    </g>
</svg>
