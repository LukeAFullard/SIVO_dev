<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
    <defs>
        <linearGradient id="glass-1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7" />
        </linearGradient>
        <linearGradient id="glass-2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6" />
        </linearGradient>
        <linearGradient id="glass-3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d946ef" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5" />
        </linearGradient>
        <linearGradient id="glass-4" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4" />
        </linearGradient>

        <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
        </filter>

        <style>
            .bg { fill: #0f172a; }
            .funnel-layer { stroke: #ffffff; stroke-width: 2; stroke-opacity: 0.3; }
            .card { fill: #1e293b; fill-opacity: 0.6; stroke: #475569; stroke-width: 1.5; rx: 16; ry: 16; }
            .text-title { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: 0.5px; }
            .text-metric { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 48px; font-weight: 800; }
            .text-label { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; }
            .text-body { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; }
            .connector { stroke: #475569; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
        </style>
    </defs>

    <rect class="bg" width="1200" height="900" />

    <!-- Ambient Background Glows -->
    <circle cx="200" cy="450" r="300" fill="#3b82f6" opacity="0.15" filter="url(#glass-blur)" />
    <circle cx="1000" cy="450" r="200" fill="#f43f5e" opacity="0.15" filter="url(#glass-blur)" />

    <g id="header">
        <text id="main-title" class="text-title" x="80" y="100"></text>
        <text id="main-subtitle" class="text-body" x="80" y="130"></text>
    </g>

    <!-- Connectors from funnel to cards -->
    <g id="connectors">
        <path class="connector" d="M350 350 L450 250 L800 250" />
        <path class="connector" d="M550 450 L650 450 L800 450" />
        <path class="connector" d="M750 550 L850 650 L800 650" />
    </g>

    <!-- Funnel Pipeline (Overlapping Glass Layers) -->
    <g id="pipeline" filter="url(#shadow-soft)" transform="translate(100, 150)">
        <!-- Layer 1: Widest -->
        <path id="layer-1" class="funnel-layer" d="M0 0 L250 150 L250 450 L0 600 Z" fill="url(#glass-1)" />

        <!-- Layer 2 -->
        <path id="layer-2" class="funnel-layer" d="M200 120 L450 240 L450 360 L200 480 Z" fill="url(#glass-2)" />

        <!-- Layer 3 -->
        <path id="layer-3" class="funnel-layer" d="M400 210 L650 280 L650 320 L400 390 Z" fill="url(#glass-3)" />

        <!-- Layer 4: Narrowest -->
        <path id="layer-4" class="funnel-layer" d="M600 265 L850 290 L850 310 L600 335 Z" fill="url(#glass-4)" />
    </g>

    <!-- Data KPI Cards (Glassmorphic) -->
    <g id="cards" filter="url(#shadow-soft)">
        <!-- Card 1 -->
        <g id="kpi-group-1" transform="translate(800, 150)">
            <rect id="card-1-bg" class="card" width="320" height="160" />
            <text id="card-1-label" class="text-label" x="30" y="40"></text>
            <text id="card-1-metric" class="text-metric" x="30" y="95"></text>
            <text id="card-1-desc" class="text-body" x="30" y="130"></text>
        </g>

        <!-- Card 2 -->
        <g id="kpi-group-2" transform="translate(800, 350)">
            <rect id="card-2-bg" class="card" width="320" height="160" />
            <text id="card-2-label" class="text-label" x="30" y="40"></text>
            <text id="card-2-metric" class="text-metric" x="30" y="95"></text>
            <text id="card-2-desc" class="text-body" x="30" y="130"></text>
        </g>

        <!-- Card 3 -->
        <g id="kpi-group-3" transform="translate(800, 550)">
            <rect id="card-3-bg" class="card" width="320" height="160" />
            <text id="card-3-label" class="text-label" x="30" y="40"></text>
            <text id="card-3-metric" class="text-metric" x="30" y="95"></text>
            <text id="card-3-desc" class="text-body" x="30" y="130"></text>
        </g>
    </g>

    <!-- Conversion Metric Tags overlaid on funnel -->
    <g id="funnel-tags">
        <!-- Tag 1 -->
        <g id="tag-1" transform="translate(300, 480)">
            <rect class="card" width="100" height="40" rx="20" ry="20" fill="#0f172a" fill-opacity="0.8" />
            <text id="tag-1-val" class="text-body" x="50" y="25" text-anchor="middle" font-weight="700" fill="#3b82f6"></text>
        </g>

        <!-- Tag 2 -->
        <g id="tag-2" transform="translate(500, 420)">
            <rect class="card" width="100" height="40" rx="20" ry="20" fill="#0f172a" fill-opacity="0.8" />
            <text id="tag-2-val" class="text-body" x="50" y="25" text-anchor="middle" font-weight="700" fill="#d946ef"></text>
        </g>

        <!-- Tag 3 -->
        <g id="tag-3" transform="translate(700, 370)">
            <rect class="card" width="100" height="40" rx="20" ry="20" fill="#0f172a" fill-opacity="0.8" />
            <text id="tag-3-val" class="text-body" x="50" y="25" text-anchor="middle" font-weight="700" fill="#f43f5e"></text>
        </g>
    </g>
</svg>