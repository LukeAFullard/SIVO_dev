<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f0f4f8; }
      .line { stroke: #cbd5e1; stroke-width: 4; stroke-dasharray: 8 8; }
      .node { fill: #ffffff; stroke: #3b82f6; stroke-width: 4; rx: 20; ry: 20; }
      .large-node { fill: #ffffff; stroke: #3b82f6; stroke-width: 6; rx: 80; ry: 80; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 8; ry: 8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="900" />

  <!-- Central large node on the left -->
  <circle id="large_node_dot" class="large-node" cx="240" cy="450" r="120" />

  <!-- Large text area on the right -->
  <rect id="text_area" class="card" x="440" y="90" width="680" height="540" />

  <!-- Button area below the text area (2 wide, 3 deep grid) -->
  <rect id="button_1" class="card" x="440" y="650" width="330" height="60" />
  <rect id="button_2" class="card" x="790" y="650" width="330" height="60" />

  <rect id="button_3" class="card" x="440" y="730" width="330" height="60" />
  <rect id="button_4" class="card" x="790" y="730" width="330" height="60" />

  <rect id="button_5" class="card" x="440" y="810" width="330" height="60" />
  <rect id="button_6" class="card" x="790" y="810" width="330" height="60" />
</svg>
