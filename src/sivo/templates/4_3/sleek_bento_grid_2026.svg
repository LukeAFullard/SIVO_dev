<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #f1f5f9; }
            .card { fill: #ffffff; rx: 24; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.03)); }
            .card-accent { fill: #1e293b; rx: 24; filter: drop-shadow(0 10px 15px rgba(30,41,59,0.1)); }
            .metric { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 64px; font-weight: 700; fill: #0f172a; }
            .metric-light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 64px; font-weight: 700; fill: #ffffff; }
            .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 1.5px; }
            .label-light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; }
            .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 36px; font-weight: 800; fill: #0f172a; }
        </style>
    </defs>

    <!-- Background -->
    <rect id="background" width="1200" height="900" class="bg" />

    <!-- Header Section -->
    <text id="dash_title" x="60" y="80" class="title"></text>
    <text id="dash_subtitle" x="60" y="110" class="label"></text>

    <!-- Bento Grid Structure (4:3) -->

    <!-- Top Left Main Highlight -->
    <g id="card_1">
        <rect id="bg_c1" x="60" y="150" width="520" height="420" class="card-accent" />
        <rect x="100" y="190" width="60" height="60" rx="12" fill="#334155" />
        <text id="label_c1" x="100" y="300" class="label-light"></text>
        <text id="val_c1" x="100" y="380" class="metric-light"></text>
        <!-- Sparkline -->
        <path d="M 100 500 Q 200 400 300 450 T 520 350" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Top Right 1 -->
    <g id="card_2">
        <rect id="bg_c2" x="620" y="150" width="520" height="190" class="card" />
        <rect x="660" y="180" width="48" height="48" rx="12" fill="#e2e8f0" />
        <text id="label_c2" x="730" y="210" class="label"></text>
        <text id="val_c2" x="730" y="290" class="metric"></text>
    </g>

    <!-- Top Right 2 -->
    <g id="card_3">
        <rect id="bg_c3" x="620" y="380" width="520" height="190" class="card" />
        <rect x="660" y="410" width="48" height="48" rx="12" fill="#e2e8f0" />
        <text id="label_c3" x="730" y="440" class="label"></text>
        <text id="val_c3" x="730" y="520" class="metric"></text>
    </g>

    <!-- Bottom Row - 3 Columns -->
    <g id="card_4">
        <rect id="bg_c4" x="60" y="610" width="330" height="230" class="card" />
        <text id="label_c4" x="100" y="660" class="label"></text>
        <text id="val_c4" x="100" y="740" class="metric" font-size="52px"></text>
        <path d="M 100 800 L 350 800" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
        <path d="M 100 800 L 250 800" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    </g>

    <g id="card_5">
        <rect id="bg_c5" x="430" y="610" width="330" height="230" class="card" />
        <text id="label_c5" x="470" y="660" class="label"></text>
        <text id="val_c5" x="470" y="740" class="metric" font-size="52px"></text>
        <path d="M 470 800 L 720 800" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
        <path d="M 470 800 L 580 800" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
    </g>

    <g id="card_6">
        <rect id="bg_c6" x="810" y="610" width="330" height="230" class="card" />
        <text id="label_c6" x="850" y="660" class="label"></text>
        <text id="val_c6" x="850" y="740" class="metric" font-size="52px"></text>
        <path d="M 850 800 L 1100 800" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
        <path d="M 850 800 L 1020 800" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    </g>
</svg>