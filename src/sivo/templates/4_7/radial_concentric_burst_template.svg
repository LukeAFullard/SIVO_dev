<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #f1f5f9; }
            .orbit-ring { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
            .center-orb { fill: #3b82f6; filter: drop-shadow(0 15px 30px rgba(59,130,246,0.3)); }
            .orb-text { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 24px; font-weight: 800; text-anchor: middle; alignment-baseline: middle; }
            .satellite-card {
                fill: rgba(255, 255, 255, 0.7);
                rx: 40;
                ry: 40;
                stroke: rgba(255, 255, 255, 0.5);
                stroke-width: 1.5;
                filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.1)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0));
                transition: transform 0.3s; cursor: pointer;
            }
            .satellite-title { fill: #374151; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; alignment-baseline: middle; }
            .satellite-metric { fill: #3b82f6; font-family: system-ui, sans-serif; font-size: 20px; font-weight: 800; text-anchor: middle; alignment-baseline: middle; }
        </style>

        <!-- Soft Mesh Gradient Blob Background for Glassmorphism effect -->
        <filter id="blurFilter">
            <feGaussianBlur stdDeviation="80" />
        </filter>
        <radialGradient id="meshGradient1" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#bfdbfe" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>
        <radialGradient id="meshGradient2" cx="70%" cy="70%" r="50%">
            <stop offset="0%" stop-color="#e9d5ff" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>
    </defs>

    <rect id="background" class="bg" width="800" height="1400" />
    <circle cx="200" cy="350" r="400" fill="url(#meshGradient1)" filter="url(#blurFilter)" opacity="0.8" />
    <circle cx="600" cy="1050" r="400" fill="url(#meshGradient2)" filter="url(#blurFilter)" opacity="0.6" />

    <!-- Orbit Rings -->
    <circle class="orbit-ring" cx="400" cy="700" r="200" />
    <circle class="orbit-ring" cx="400" cy="700" r="320" />

    <!-- Center Hub -->
    <g id="radial-center">
        <circle class="center-orb" cx="400" cy="700" r="80" />
        <text id="text_hub" class="orb-text" x="400" y="700"></text>
        <circle cx="400" cy="700" r="72" fill="transparent" id="radial-center-data" />
    </g>

    <g id="sat-inner-1">
        <circle class="satellite-card" cx="400" cy="500" r="64" />
        <text id="text_sys_a" class="satellite-title" x="400" y="492"></text>
        <text id="val_sys_a" class="satellite-metric" x="400" y="516"></text>
        <circle cx="400" cy="500" r="57.6" fill="transparent" id="sat-inner-1-data"/>
    </g>
    <g id="sat-inner-2">
        <circle class="satellite-card" cx="573.2" cy="800" r="64" />
        <text id="text_sys_b" class="satellite-title" x="573.2" y="792"></text>
        <text id="val_sys_b" class="satellite-metric" x="573.2" y="816"></text>
        <circle cx="573.2" cy="800" r="57.6" fill="transparent" id="sat-inner-2-data"/>
    </g>
    <g id="sat-inner-3">
        <circle class="satellite-card" cx="226.8" cy="800" r="64" />
        <text id="text_sys_c" class="satellite-title" x="226.8" y="792"></text>
        <text id="val_sys_c" class="satellite-metric" x="226.8" y="816"></text>
        <circle cx="226.8" cy="800" r="57.6" fill="transparent" id="sat-inner-3-data"/>
    </g>
    <g id="sat-outer-1">
        <circle class="satellite-card" cx="400" cy="380" r="48" />
        <text id="text_ext_1" class="satellite-title" x="400" y="376"></text>
        <text id="val_ext_1" class="satellite-metric" x="400" y="392"></text>
        <rect fill="transparent" x="352" y="332" width="96" height="96" id="sat-outer-1-data"/>
    </g>
    <g id="sat-outer-2">
        <circle class="satellite-card" cx="677.1" cy="540" r="48" />
        <text id="text_ext_2" class="satellite-title" x="677.1" y="536"></text>
        <text id="val_ext_2" class="satellite-metric" x="677.1" y="552"></text>
        <rect fill="transparent" x="629.1" y="492" width="96" height="96" id="sat-outer-2-data"/>
    </g>
    <g id="sat-outer-3">
        <circle class="satellite-card" cx="677.1" cy="860" r="48" />
        <text id="text_ext_3" class="satellite-title" x="677.1" y="856"></text>
        <text id="val_ext_3" class="satellite-metric" x="677.1" y="872"></text>
        <rect fill="transparent" x="629.1" y="812" width="96" height="96" id="sat-outer-3-data"/>
    </g>
    <g id="sat-outer-4">
        <circle class="satellite-card" cx="400" cy="1020" r="48" />
        <text id="text_ext_4" class="satellite-title" x="400" y="1016"></text>
        <text id="val_ext_4" class="satellite-metric" x="400" y="1032"></text>
        <rect fill="transparent" x="352" y="972" width="96" height="96" id="sat-outer-4-data"/>
    </g>
    <g id="sat-outer-5">
        <circle class="satellite-card" cx="122.9" cy="860" r="48" />
        <text id="text_ext_5" class="satellite-title" x="122.9" y="856"></text>
        <text id="val_ext_5" class="satellite-metric" x="122.9" y="872"></text>
        <rect fill="transparent" x="74.9" y="812" width="96" height="96" id="sat-outer-5-data"/>
    </g>
    <g id="sat-outer-6">
        <circle class="satellite-card" cx="122.9" cy="540" r="48" />
        <text id="text_ext_6" class="satellite-title" x="122.9" y="536"></text>
        <text id="val_ext_6" class="satellite-metric" x="122.9" y="552"></text>
        <rect fill="transparent" x="74.9" y="492" width="96" height="96" id="sat-outer-6-data"/>
    </g>
</svg>