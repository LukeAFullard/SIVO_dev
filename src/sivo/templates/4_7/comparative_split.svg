<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1750" width="100%" height="100%">
    <!-- Base Background -->
    <rect id="background" width="1000" height="1750" fill="#ffffff" />

    <!-- Title -->
    <text id="dash_title" x="500" y="80" font-family="sans-serif" font-size="56px" font-weight="bold" fill="#333333" text-anchor="middle">Comparative Split</text>
    <text id="dash_subtitle" x="500" y="140" font-family="sans-serif" font-size="32px" fill="#666666" text-anchor="middle">Subtitle</text>

    <!-- Panel A (Top) -->
    <g id="panel_a">
        <rect id="bg_panel_a" x="50" y="200" width="900" height="650" fill="#f0f0f0" rx="16" />
        <text id="title_panel_a" x="500" y="280" font-family="sans-serif" font-size="40px" font-weight="bold" fill="#333333" text-anchor="middle">Option A</text>
        <rect id="chart_a" x="150" y="350" width="700" height="350" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_a" x="500" y="780" font-family="sans-serif" font-size="24px" fill="#666666" text-anchor="middle">Description A</text>
    </g>

    <!-- Divider -->
    <line x1="50" y1="925" x2="950" y2="925" stroke="#cccccc" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="500" cy="925" r="40" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    <text x="500" y="938" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#333333" text-anchor="middle">VS</text>

    <!-- Panel B (Bottom) -->
    <g id="panel_b">
        <rect id="bg_panel_b" x="50" y="1000" width="900" height="650" fill="#f0f0f0" rx="16" />
        <text id="title_panel_b" x="500" y="1080" font-family="sans-serif" font-size="40px" font-weight="bold" fill="#333333" text-anchor="middle">Option B</text>
        <rect id="chart_b" x="150" y="1150" width="700" height="350" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_b" x="500" y="1580" font-family="sans-serif" font-size="24px" fill="#666666" text-anchor="middle">Description B</text>
    </g>
</svg>
