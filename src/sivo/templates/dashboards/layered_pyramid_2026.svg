<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #0f172a; }
            .tier { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.2); stroke-width: 2px; transition: all 0.3s ease; cursor: pointer; }
            .tier:hover { fill: rgba(255,255,255,0.15); stroke: rgba(57, 255, 20, 0.8); }
            .bento { fill: rgba(15,23,42,0.6); stroke: rgba(255,255,255,0.1); stroke-width: 1px; rx: 12px; }
            .text-main { fill: #f8fafc; font-family: sans-serif; font-size: 21px; font-weight: bold; text-anchor: middle; alignment-baseline: middle; }
        </style>
    </defs>

    <!-- Background -->
    <rect class="bg" width="100%" height="100%"/>

    <!-- Title Area -->
    <text x="960.0" y="86.4" class="text-main" font-size="43px" id="main-title">Layered Pyramid Architecture</text>
    <text x="960.0" y="129.6" class="text-main" font-size="21px" fill="#94a3b8" id="sub-title">Data Funnel &amp; Conversions</text>

    <!-- Bento Boxes -->
    <rect id="bento-1" class="bento" x="96.0" y="108.0" width="384.0" height="378.0" />
    <rect id="bento-2" class="bento" x="96.0" y="540.0" width="384.0" height="432.0" />
    <rect id="bento-3" class="bento" x="1440.0" y="108.0" width="384.0" height="378.0" />
    <rect id="bento-4" class="bento" x="1440.0" y="540.0" width="384.0" height="432.0" />

    <!-- Pyramid Tiers -->
    <polygon id="tier-1" class="tier" points="960.0,162.0 960.0,162.0 1054.5,351.0 865.5,351.0" />
    <polygon id="tier-2" class="tier" points="865.5,351.0 1054.5,351.0 1149.0,540.0 771.0,540.0" />
    <polygon id="tier-3" class="tier" points="771.0,540.0 1149.0,540.0 1243.5,729.0 676.5,729.0" />
    <polygon id="tier-4" class="tier" points="676.5,729.0 1243.5,729.0 1338.0,918.0 582.0,918.0" />

    <!-- Text overlays on pyramid -->
    <text x="960.0" y="275.4" class="text-main" id="text-tier-1">Tier 1</text>
    <text x="960.0" y="445.5" class="text-main" id="text-tier-2">Tier 2</text>
    <text x="960.0" y="634.5" class="text-main" id="text-tier-3">Tier 3</text>
    <text x="960.0" y="823.5" class="text-main" id="text-tier-4">Tier 4</text>
</svg>