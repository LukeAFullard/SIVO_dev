<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
    <!-- Base Background -->
    <rect id="background" width="1600" height="900" fill="#ffffff" />

    <!-- Title -->
    <text id="dash_title" x="800" y="80" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#333333" text-anchor="middle">Comparative Split</text>
    <text id="dash_subtitle" x="800" y="120" font-family="sans-serif" font-size="24px" fill="#666666" text-anchor="middle">Subtitle</text>

    <!-- Panel A (Left) -->
    <g id="panel_a">
        <rect id="bg_panel_a" x="50" y="160" width="700" height="690" fill="#f0f0f0" rx="16" />
        <text id="title_panel_a" x="400" y="220" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#333333" text-anchor="middle">Option A</text>
        <rect id="chart_a" x="100" y="280" width="600" height="350" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_a" x="400" y="700" font-family="sans-serif" font-size="20px" fill="#666666" text-anchor="middle">Description A</text>
    </g>

    <!-- Divider -->
    <line x1="800" y1="160" x2="800" y2="850" stroke="#cccccc" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="800" cy="505" r="30" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    <text x="800" y="515" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#333333" text-anchor="middle">VS</text>

    <!-- Panel B (Right) -->
    <g id="panel_b">
        <rect id="bg_panel_b" x="850" y="160" width="700" height="690" fill="#f0f0f0" rx="16" />
        <text id="title_panel_b" x="1200" y="220" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#333333" text-anchor="middle">Option B</text>
        <rect id="chart_b" x="900" y="280" width="600" height="350" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_b" x="1200" y="700" font-family="sans-serif" font-size="20px" fill="#666666" text-anchor="middle">Description B</text>
    </g>
</svg>
