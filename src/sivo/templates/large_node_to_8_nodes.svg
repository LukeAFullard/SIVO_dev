  <!-- Line 5 -->
  <line class="line" x1="320" y1="500" x2="550" y2="557.1428571428571" />
  <!-- Line 6 -->
  <line class="line" x1="320" y1="500" x2="550" y2="671.4285714285714" />
  <!-- Line 7 -->
  <line class="line" x1="320" y1="500" x2="550" y2="785.7142857142858" />
  <!-- Line 8 -->
  <line class="line" x1="320" y1="500" x2="550" y2="900.0" />

  <!-- Node 1 -->
  <circle id="node_1_dot" class="node" cx="550" cy="100.0" r="20" />
  <rect id="node_1_card" class="card" x="600" y="52.857142857142854" width="350" height="94.28571428571429" />
  <!-- Node 2 -->
  <circle id="node_2_dot" class="node" cx="550" cy="214.28571428571428" r="20" />
  <rect id="node_2_card" class="card" x="600" y="167.14285714285714" width="350" height="94.28571428571429" />
  <!-- Node 3 -->
