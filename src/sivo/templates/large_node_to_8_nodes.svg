  <line class="line" x1="320" y1="500" x2="550" y2="100.0" />
  <!-- Line 2 -->
  <line class="line" x1="320" y1="500" x2="550" y2="214.28571428571428" />
  <!-- Line 3 -->
  <line class="line" x1="320" y1="500" x2="550" y2="328.57142857142856" />
  <!-- Line 4 -->
