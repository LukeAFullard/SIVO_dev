  <!-- Node 4 -->
  <circle id="node_4_dot" class="node" cx="550" cy="442.8571428571429" r="20" />
  <rect id="node_4_card" class="card" x="600" y="395.7142857142857" width="350" height="94.28571428571429" />
  <!-- Node 5 -->
  <circle id="node_5_dot" class="node" cx="550" cy="557.1428571428571" r="20" />
  <rect id="node_5_card" class="card" x="600" y="509.99999999999994" width="350" height="94.28571428571429" />
  <!-- Node 6 -->
