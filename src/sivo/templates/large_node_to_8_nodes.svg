<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f0f4f8; }
      .line { stroke: #cbd5e1; stroke-width: 4; stroke-dasharray: 8 8; }
      .node { fill: #ffffff; stroke: #3b82f6; stroke-width: 4; rx: 20; ry: 20; }
      .large-node { fill: #ffffff; stroke: #3b82f6; stroke-width: 6; rx: 80; ry: 80; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 8; ry: 8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
    </style>
  </defs>

  <rect class="bg" width="1000" height="1000" />

  <!-- Central large node on the left -->
  <circle id="large_node_dot" class="large-node" cx="200" cy="500" r="120" />

  <!-- Lines from large node to nodes on the right -->
