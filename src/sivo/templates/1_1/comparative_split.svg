<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
    <!-- Base Background -->
    <rect id="background" width="1200" height="1200" fill="#ffffff" />

    <!-- Title -->
    <text id="dash_title" x="600" y="80" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#333333" text-anchor="middle">Comparative Split</text>
    <text id="dash_subtitle" x="600" y="120" font-family="sans-serif" font-size="24px" fill="#666666" text-anchor="middle">Subtitle</text>

    <!-- Panel A (Left) -->
    <g id="panel_a">
        <rect id="bg_panel_a" x="50" y="180" width="500" height="970" fill="#f0f0f0" rx="16" />
        <text id="title_panel_a" x="300" y="240" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#333333" text-anchor="middle">Option A</text>
        <rect id="chart_a" x="100" y="300" width="400" height="600" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_a" x="300" y="960" font-family="sans-serif" font-size="20px" fill="#666666" text-anchor="middle">Description A</text>
    </g>

    <!-- Divider -->
    <line x1="600" y1="180" x2="600" y2="1150" stroke="#cccccc" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="600" cy="665" r="30" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    <text x="600" y="675" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#333333" text-anchor="middle">VS</text>

    <!-- Panel B (Right) -->
    <g id="panel_b">
        <rect id="bg_panel_b" x="650" y="180" width="500" height="970" fill="#f0f0f0" rx="16" />
        <text id="title_panel_b" x="900" y="240" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#333333" text-anchor="middle">Option B</text>
        <rect id="chart_b" x="700" y="300" width="400" height="600" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_b" x="900" y="960" font-family="sans-serif" font-size="20px" fill="#666666" text-anchor="middle">Description B</text>
    </g>
</svg>
