<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
    <defs>
        <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#047857" />
        </radialGradient>
        <radialGradient id="bg-fade" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#111827" />
            <stop offset="100%" stop-color="#030712" />
        </radialGradient>
        <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <style>
            .bg { fill: url(#bg-fade); }
            .orbit { stroke: #374151; stroke-width: 1.5; fill: none; }
            .orbit-dashed { stroke: #4b5563; stroke-width: 2; stroke-dasharray: 8 12; fill: none; }
            .orbit-active { stroke: #10b981; stroke-width: 3; stroke-opacity: 0.6; fill: none; }
            .node-core { fill: url(#core-glow); stroke: #34d399; stroke-width: 4; }
            .node-sat { fill: #0f172a; stroke: #10b981; stroke-width: 3; }
            .node-sat-alt { fill: #0f172a; stroke: #3b82f6; stroke-width: 3; }
            .card { fill: #1e293b; fill-opacity: 0.9; stroke: #334155; stroke-width: 1; rx: 12; ry: 12; }
            .text-display { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 700; text-anchor: middle; }
            .text-h2 { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 600; text-anchor: middle; }
            .text-body { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; text-anchor: middle; }
            .connector { stroke: #34d399; stroke-width: 2; stroke-opacity: 0.5; fill: none; stroke-dasharray: 4 4; }
        </style>
    </defs>

    <rect class="bg" width="1000" height="1000" />

    <!-- Orbital Paths -->
    <g id="orbital-rings">
        <circle id="orbit-1" class="orbit" cx="500" cy="500" r="150" />
        <circle id="orbit-2" class="orbit-dashed" cx="500" cy="500" r="280" />
        <circle id="orbit-3" class="orbit" cx="500" cy="500" r="400" />

        <!-- Active Orbit Arc -->
        <path id="orbit-active-arc" class="orbit-active" d="M100 500 A400 400 0 0 1 500 100" filter="url(#neon-glow)" />
    </g>

    <!-- Center Core -->
    <g id="core-system">
        <circle id="core-node" class="node-core" cx="500" cy="500" r="60" filter="url(#neon-glow)" />
        <text id="core-title" class="text-display" x="500" y="510"></text>
    </g>

    <!-- Connectors -->
    <g id="connectors">
        <!-- Inner ring connections -->
        <path class="connector" d="M500 500 L500 350" />
        <path class="connector" d="M500 500 L370 575" />
        <path class="connector" d="M500 500 L630 575" />

        <!-- Outer ring connections -->
        <path class="connector" d="M500 500 L846 300" />
        <path class="connector" d="M500 500 L154 300" stroke="#3b82f6" />
        <path class="connector" d="M500 500 L500 900" />
    </g>

    <!-- Satellites & Cards -->
    <g id="satellite-nodes">

        <!-- Inner Orbit Nodes -->
        <g id="sat-group-1" transform="translate(500, 350)">
            <circle id="sat-node-1" class="node-sat" cx="0" cy="0" r="16" filter="url(#soft-glow)" />
            <rect id="sat-card-1" class="card" x="-80" y="-80" width="160" height="60" />
            <text id="sat-title-1" class="text-h2" x="0" y="-45"></text>
            <text id="sat-desc-1" class="text-body" x="0" y="-25"></text>
        </g>

        <g id="sat-group-2" transform="translate(370, 575)">
            <circle id="sat-node-2" class="node-sat" cx="0" cy="0" r="16" filter="url(#soft-glow)" />
            <rect id="sat-card-2" class="card" x="-180" y="-30" width="160" height="60" />
            <text id="sat-title-2" class="text-h2" x="-100" y="5"></text>
            <text id="sat-desc-2" class="text-body" x="-100" y="25"></text>
        </g>

        <g id="sat-group-3" transform="translate(630, 575)">
            <circle id="sat-node-3" class="node-sat" cx="0" cy="0" r="16" filter="url(#soft-glow)" />
            <rect id="sat-card-3" class="card" x="20" y="-30" width="160" height="60" />
            <text id="sat-title-3" class="text-h2" x="100" y="5"></text>
            <text id="sat-desc-3" class="text-body" x="100" y="25"></text>
        </g>

        <!-- Middle Orbit Nodes (Dashed) -->
        <circle id="sat-node-mid-1" class="node-sat-alt" cx="220" cy="500" r="12" />
        <circle id="sat-node-mid-2" class="node-sat-alt" cx="780" cy="500" r="12" />
        <circle id="sat-node-mid-3" class="node-sat-alt" cx="500" cy="780" r="12" />
        <circle id="sat-node-mid-4" class="node-sat-alt" cx="500" cy="220" r="12" />

        <!-- Outer Orbit Macro Nodes -->
        <g id="macro-group-1" transform="translate(846, 300)">
            <circle id="macro-node-1" class="node-sat" cx="0" cy="0" r="24" filter="url(#soft-glow)" />
            <rect id="macro-card-1" class="card" x="-100" y="-120" width="200" height="80" />
            <text id="macro-title-1" class="text-display" x="0" y="-75"></text>
            <text id="macro-desc-1" class="text-h2" x="0" y="-50"></text>
        </g>

        <g id="macro-group-2" transform="translate(154, 300)">
            <circle id="macro-node-2" class="node-sat-alt" cx="0" cy="0" r="24" filter="url(#soft-glow)" />
            <rect id="macro-card-2" class="card" x="-100" y="-120" width="200" height="80" />
            <text id="macro-title-2" class="text-display" x="0" y="-75"></text>
            <text id="macro-desc-2" class="text-h2" x="0" y="-50"></text>
        </g>

        <g id="macro-group-3" transform="translate(500, 900)">
            <circle id="macro-node-3" class="node-sat" cx="0" cy="0" r="24" filter="url(#soft-glow)" />
            <rect id="macro-card-3" class="card" x="-100" y="40" width="200" height="80" />
            <text id="macro-title-3" class="text-display" x="0" y="85"></text>
            <text id="macro-desc-3" class="text-h2" x="0" y="110"></text>
        </g>
    </g>

    <!-- Header UI -->
    <g id="header">
        <text id="main-system-title" class="text-display" x="100" y="100" text-anchor="start"></text>
        <text id="main-system-sub" class="text-body" x="100" y="130" text-anchor="start"></text>
    </g>
</svg>