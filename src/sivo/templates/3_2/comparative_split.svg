<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <!-- Base Background -->
    <rect id="background" width="1200" height="800" fill="#ffffff" />

    <!-- Title -->
    <text id="dash_title" x="600" y="60" font-family="sans-serif" font-size="40px" font-weight="bold" fill="#333333" text-anchor="middle">Comparative Split</text>
    <text id="dash_subtitle" x="600" y="90" font-family="sans-serif" font-size="20px" fill="#666666" text-anchor="middle">Subtitle</text>

    <!-- Panel A (Left) -->
    <g id="panel_a">
        <rect id="bg_panel_a" x="40" y="140" width="520" height="620" fill="#f0f0f0" rx="16" />
        <text id="title_panel_a" x="300" y="200" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#333333" text-anchor="middle">Option A</text>
        <rect id="chart_a" x="80" y="250" width="440" height="300" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_a" x="300" y="620" font-family="sans-serif" font-size="16px" fill="#666666" text-anchor="middle">Description A</text>
    </g>

    <!-- Divider -->
    <line x1="600" y1="140" x2="600" y2="760" stroke="#cccccc" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="600" cy="450" r="25" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
    <text x="600" y="460" font-family="sans-serif" font-size="20px" font-weight="bold" fill="#333333" text-anchor="middle">VS</text>

    <!-- Panel B (Right) -->
    <g id="panel_b">
        <rect id="bg_panel_b" x="640" y="140" width="520" height="620" fill="#f0f0f0" rx="16" />
        <text id="title_panel_b" x="900" y="200" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#333333" text-anchor="middle">Option B</text>
        <rect id="chart_b" x="680" y="250" width="440" height="300" fill="#e0e0e0" rx="8" />
        <text id="desc_panel_b" x="900" y="620" font-family="sans-serif" font-size="16px" fill="#666666" text-anchor="middle">Description B</text>
    </g>
</svg>
