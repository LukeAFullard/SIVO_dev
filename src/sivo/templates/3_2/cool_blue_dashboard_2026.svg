<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #f8fafc; }
            .card { fill: #ffffff; rx: 16; filter: drop-shadow(0 10px 15px rgba(14,165,233,0.05)); }
            .card-highlight { fill: url(#coolBlueGrad); rx: 16; }
            .metric { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 56px; font-weight: 700; fill: #0f172a; }
            .metric-light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 56px; font-weight: 700; fill: #ffffff; }
            .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 1.5px; }
            .label-light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #e0f2fe; text-transform: uppercase; letter-spacing: 1.5px; }
            .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 36px; font-weight: 800; fill: #0f172a; letter-spacing: -0.5px; }
            .icon-bg { fill: #e0f2fe; rx: 12; }
            .icon-path { fill: #0284c7; }
        </style>
        <linearGradient id="coolBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#0ea5e9" />
        </linearGradient>
        <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect id="background" width="1200" height="800" class="bg" />

    <!-- Header Section -->
    <text id="dash_title" x="60" y="80" class="title">Platform Analytics</text>
    <text id="dash_subtitle" x="60" y="110" class="label">LIVE DATA FEED / COOL BLUE THEME</text>

    <!-- Top Bento Grid Layer -->

    <!-- Primary Highlight Metric -->
    <g id="metric_main_card">
        <rect id="bg_main" x="60" y="160" width="340" height="240" class="card-highlight" />
        <!-- Icon Placeholder -->
        <rect x="90" y="190" width="48" height="48" fill="#ffffff" fill-opacity="0.2" rx="12" />
        <path d="M 102 202 L 126 226 M 126 202 L 102 226" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        <text id="label_main" x="90" y="290" class="label-light">Total Revenue</text>
        <text id="val_main" x="90" y="350" class="metric-light">$124.5K</text>
    </g>

    <!-- Secondary Metrics -->
    <g id="metric_2_card">
        <rect id="bg_m2" x="430" y="160" width="340" height="240" class="card" />
        <rect x="460" y="190" width="48" height="48" class="icon-bg" />
        <text id="label_m2" x="460" y="290" class="label">Active Users</text>
        <text id="val_m2" x="460" y="350" class="metric">45,291</text>
    </g>

    <g id="metric_3_card">
        <rect id="bg_m3" x="800" y="160" width="340" height="240" class="card" />
        <rect x="830" y="190" width="48" height="48" class="icon-bg" />
        <text id="label_m3" x="830" y="290" class="label">Conversion</text>
        <text id="val_m3" x="830" y="350" class="metric">12.8%</text>
    </g>

    <!-- Bottom Chart Area -->
    <g id="chart_card">
        <rect id="bg_chart" x="60" y="440" width="1080" height="300" class="card" />
        <text id="label_chart" x="100" y="490" class="label">Growth Trajectory</text>

        <!-- Abstract Area Chart Shape -->
        <path d="M 100 680 L 100 600 Q 250 500 400 550 T 700 480 T 1000 620 L 1040 680 Z" fill="url(#chartGrad)" />
        <path d="M 100 600 Q 250 500 400 550 T 700 480 T 1040 620" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" />

        <!-- Data Points -->
        <circle id="point_1" cx="400" cy="550" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
        <circle id="point_2" cx="700" cy="480" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
        <circle id="point_3" cx="1040" cy="620" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
    </g>
</svg>