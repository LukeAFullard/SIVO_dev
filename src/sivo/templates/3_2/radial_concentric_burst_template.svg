<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #f1f5f9; }
            .orbit-ring { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
            .center-orb { fill: #3b82f6; filter: drop-shadow(0 15px 30px rgba(59,130,246,0.3)); }
            .orb-text { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 24px; font-weight: 800; text-anchor: middle; alignment-baseline: middle; }
            .satellite-card {
                fill: rgba(255, 255, 255, 0.7);
                rx: 40;
                ry: 40;
                stroke: rgba(255, 255, 255, 0.5);
                stroke-width: 1.5;
                filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.1)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0));
                transition: transform 0.3s; cursor: pointer;
            }
            .satellite-title { fill: #374151; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; alignment-baseline: middle; }
            .satellite-metric { fill: #3b82f6; font-family: system-ui, sans-serif; font-size: 20px; font-weight: 800; text-anchor: middle; alignment-baseline: middle; }
        </style>

        <!-- Soft Mesh Gradient Blob Background for Glassmorphism effect -->
        <filter id="blurFilter">
            <feGaussianBlur stdDeviation="80" />
        </filter>
        <radialGradient id="meshGradient1" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#bfdbfe" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>
        <radialGradient id="meshGradient2" cx="70%" cy="70%" r="50%">
            <stop offset="0%" stop-color="#e9d5ff" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>
    </defs>

    <rect id="background" class="bg" width="1200" height="800" />
    <circle cx="300" cy="200" r="400" fill="url(#meshGradient1)" filter="url(#blurFilter)" opacity="0.8" />
    <circle cx="900" cy="600" r="400" fill="url(#meshGradient2)" filter="url(#blurFilter)" opacity="0.6" />

    <!-- Orbit Rings -->
    <circle class="orbit-ring" cx="600" cy="400" r="200" />
    <circle class="orbit-ring" cx="600" cy="400" r="320" />

    <!-- Center Hub -->
    <g id="radial-center">
        <circle class="center-orb" cx="600" cy="400" r="80" />
        <text id="text_hub" class="orb-text" x="600" y="400"></text>
        <circle cx="600" cy="400" r="72" fill="transparent" id="radial-center-data" />
    </g>

    <g id="sat-inner-1">
        <circle class="satellite-card" cx="600" cy="200" r="64" />
        <text id="text_sys_a" class="satellite-title" x="600" y="192"></text>
        <text id="val_sys_a" class="satellite-metric" x="600" y="216"></text>
        <circle cx="600" cy="200" r="57.6" fill="transparent" id="sat-inner-1-data"/>
    </g>
    <g id="sat-inner-2">
        <circle class="satellite-card" cx="773.2" cy="500" r="64" />
        <text id="text_sys_b" class="satellite-title" x="773.2" y="492"></text>
        <text id="val_sys_b" class="satellite-metric" x="773.2" y="516"></text>
        <circle cx="773.2" cy="500" r="57.6" fill="transparent" id="sat-inner-2-data"/>
    </g>
    <g id="sat-inner-3">
        <circle class="satellite-card" cx="426.8" cy="500" r="64" />
        <text id="text_sys_c" class="satellite-title" x="426.8" y="492"></text>
        <text id="val_sys_c" class="satellite-metric" x="426.8" y="516"></text>
        <circle cx="426.8" cy="500" r="57.6" fill="transparent" id="sat-inner-3-data"/>
    </g>
    <g id="sat-outer-1">
        <circle class="satellite-card" cx="600" cy="80" r="48" />
        <text id="text_ext_1" class="satellite-title" x="600" y="76"></text>
        <text id="val_ext_1" class="satellite-metric" x="600" y="92"></text>
        <rect fill="transparent" x="552" y="32" width="96" height="96" id="sat-outer-1-data"/>
    </g>
    <g id="sat-outer-2">
        <circle class="satellite-card" cx="877.1" cy="240" r="48" />
        <text id="text_ext_2" class="satellite-title" x="877.1" y="236"></text>
        <text id="val_ext_2" class="satellite-metric" x="877.1" y="252"></text>
        <rect fill="transparent" x="829.1" y="192" width="96" height="96" id="sat-outer-2-data"/>
    </g>
    <g id="sat-outer-3">
        <circle class="satellite-card" cx="877.1" cy="560" r="48" />
        <text id="text_ext_3" class="satellite-title" x="877.1" y="556"></text>
        <text id="val_ext_3" class="satellite-metric" x="877.1" y="572"></text>
        <rect fill="transparent" x="829.1" y="512" width="96" height="96" id="sat-outer-3-data"/>
    </g>
    <g id="sat-outer-4">
        <circle class="satellite-card" cx="600" cy="720" r="48" />
        <text id="text_ext_4" class="satellite-title" x="600" y="716"></text>
        <text id="val_ext_4" class="satellite-metric" x="600" y="732"></text>
        <rect fill="transparent" x="552" y="672" width="96" height="96" id="sat-outer-4-data"/>
    </g>
    <g id="sat-outer-5">
        <circle class="satellite-card" cx="322.9" cy="560" r="48" />
        <text id="text_ext_5" class="satellite-title" x="322.9" y="556"></text>
        <text id="val_ext_5" class="satellite-metric" x="322.9" y="572"></text>
        <rect fill="transparent" x="274.9" y="512" width="96" height="96" id="sat-outer-5-data"/>
    </g>
    <g id="sat-outer-6">
        <circle class="satellite-card" cx="322.9" cy="240" r="48" />
        <text id="text_ext_6" class="satellite-title" x="322.9" y="236"></text>
        <text id="val_ext_6" class="satellite-metric" x="322.9" y="252"></text>
        <rect fill="transparent" x="274.9" y="192" width="96" height="96" id="sat-outer-6-data"/>
    </g>
</svg>