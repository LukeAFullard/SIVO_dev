<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
        <linearGradient id="plane-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="plane-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.8" />
        </linearGradient>
        <linearGradient id="plane-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.85" />
        </linearGradient>
        <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="20" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glow-mild" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .bg { fill: #020617; }
            .plane { stroke: #cbd5e1; stroke-width: 2; stroke-opacity: 0.2; stroke-linejoin: round; }
            .node { fill: #ffffff; }
            .card { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 12; ry: 12; }
            .line { stroke: #475569; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
            .text-title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 600; }
            .text-body { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
        </style>
    </defs>

    <rect class="bg" width="1200" height="800" />

    <g id="connecting-lines">
        <!-- Connecting dashed lines between planes -->
        <path class="line" d="M600 450 L600 600" />
        <path class="line" d="M600 300 L600 450" />
        <path class="line" d="M450 375 L450 525" />
        <path class="line" d="M750 375 L750 525" />
        <path class="line" d="M300 450 L300 600" opacity="0.5" />
        <path class="line" d="M900 450 L900 600" opacity="0.5" />
    </g>

    <!-- Layer 1 (Bottom - Base Infrastructure) -->
    <g id="layer-1">
        <polygon id="plane-1" class="plane" points="300,600 600,750 900,600 600,450" fill="url(#plane-grad-1)" />
        <!-- Grid lines on plane 1 -->
        <path class="line" d="M450 525 L750 675" stroke-opacity="0.3" stroke-dasharray="none" />
        <path class="line" d="M450 675 L750 525" stroke-opacity="0.3" stroke-dasharray="none" />
        <circle id="node-1-1" class="node" cx="600" cy="600" r="6" />
        <circle id="node-1-2" class="node" cx="450" cy="525" r="4" opacity="0.5" />
        <circle id="node-1-3" class="node" cx="750" cy="525" r="4" opacity="0.5" />
        <circle id="node-1-4" class="node" cx="450" cy="675" r="4" opacity="0.5" />
        <circle id="node-1-5" class="node" cx="750" cy="675" r="4" opacity="0.5" />
    </g>

    <!-- Layer 2 (Middle - Logic / Processing) -->
    <g id="layer-2">
        <polygon id="plane-2" class="plane" points="300,450 600,600 900,450 600,300" fill="url(#plane-grad-2)" filter="url(#glow-mild)" />
        <circle id="node-2-1" class="node" cx="600" cy="450" r="8" filter="url(#glow-mild)" />
        <circle id="node-2-2" class="node" cx="450" cy="375" r="5" />
        <circle id="node-2-3" class="node" cx="750" cy="375" r="5" />
        <path d="M600 450 L450 375 M600 450 L750 375" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" fill="none" />
    </g>

    <!-- Layer 3 (Top - Interface / UX) -->
    <g id="layer-3">
        <!-- Slightly smaller plane for pyramid effect -->
        <polygon id="plane-3" class="plane" points="400,300 600,400 800,300 600,200" fill="url(#plane-grad-3)" filter="url(#glow-strong)" />
        <circle id="node-3-1" class="node" cx="600" cy="300" r="10" filter="url(#glow-strong)" />
        <circle id="node-3-2" class="node" cx="500" cy="250" r="4" />
        <circle id="node-3-3" class="node" cx="700" cy="250" r="4" />
        <path d="M600 300 L500 250 M600 300 L700 250" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" fill="none" />
    </g>

    <!-- Floating Cards & Text Placeholders -->
    <g id="info-cards">
        <!-- Card 1 (Top Left) -->
        <g id="card-group-1">
            <path class="line" d="M580 290 L400 180 L280 180" stroke-dasharray="none" />
            <circle cx="580" cy="290" r="4" fill="#6d28d9" />
            <rect id="card-1" class="card" x="60" y="130" width="220" height="100" />
            <text id="card-1-title" class="text-title" x="80" y="170"></text>
            <text id="card-1-body" class="text-body" x="80" y="200"></text>
        </g>

        <!-- Card 2 (Middle Right) -->
        <g id="card-group-2">
            <path class="line" d="M760 380 L900 310 L1000 310" stroke-dasharray="none" />
            <circle cx="760" cy="380" r="4" fill="#3b82f6" />
            <rect id="card-2" class="card" x="1000" y="260" width="160" height="100" />
            <text id="card-2-title" class="text-title" x="1020" y="300"></text>
            <text id="card-2-body" class="text-body" x="1020" y="330"></text>
        </g>

        <!-- Card 3 (Bottom Left) -->
        <g id="card-group-3">
            <path class="line" d="M430 515 L300 580 L200 580" stroke-dasharray="none" />
            <circle cx="430" cy="515" r="4" fill="#94a3b8" />
            <rect id="card-3" class="card" x="20" y="530" width="180" height="100" />
            <text id="card-3-title" class="text-title" x="40" y="570"></text>
            <text id="card-3-body" class="text-body" x="40" y="600"></text>
        </g>

        <!-- Main Title -->
        <g id="main-title-group">
            <text id="main-title" class="text-title" x="60" y="60" style="font-size: 32px; fill: #ffffff;"></text>
            <text id="main-subtitle" class="text-body" x="60" y="90" style="font-size: 18px;"></text>
        </g>
    </g>
</svg>