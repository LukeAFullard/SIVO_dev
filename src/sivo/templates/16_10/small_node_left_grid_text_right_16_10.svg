<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f0f4f8; }
      .line { stroke: #cbd5e1; stroke-width: 4; stroke-dasharray: 8 8; }
      .node { fill: #ffffff; stroke: #3b82f6; stroke-width: 4; rx: 20; ry: 20; }
      .small-node { fill: #ffffff; stroke: #3b82f6; stroke-width: 6; rx: 40; ry: 40; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 8; ry: 8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000" />

  <!-- Small node top left (half diameter of large-node which was r=140) -->
  <circle id="small_node_dot" class="small-node" cx="140" cy="140" r="70" />

  <!-- Two buttons below the small node -->
  <rect id="button_1" class="card" x="80" y="280" width="300" height="80" />
  <rect id="button_2" class="card" x="420" y="280" width="300" height="80" />

  <!-- Grid of 4 large square cards below the buttons -->
  <rect id="card_1" class="card" x="80" y="420" width="300" height="240" />
  <rect id="card_2" class="card" x="420" y="420" width="300" height="240" />

  <rect id="card_3" class="card" x="80" y="700" width="300" height="240" />
  <rect id="card_4" class="card" x="420" y="700" width="300" height="240" />

  <!-- Right area taking up the whole height for text -->
  <rect id="text_area" class="card" x="800" y="80" width="720" height="860" />

</svg>
