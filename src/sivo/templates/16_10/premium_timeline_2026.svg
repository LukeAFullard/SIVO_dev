<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; rx: 12; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.02)); }
            .node { fill: #ffffff; stroke: #111827; stroke-width: 4; }
            .node-active { fill: #111827; stroke: #111827; stroke-width: 4; }
            .line { fill: none; stroke: #e5e7eb; stroke-width: 4; }
            .line-active { fill: none; stroke: #111827; stroke-width: 4; }
            .metric { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 56px; font-weight: 300; fill: #111827; letter-spacing: -2px; }
            .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #6b7280; text-transform: uppercase; letter-spacing: 2px; }
            .label-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; text-transform: uppercase; letter-spacing: 2px; }
            .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 40px; font-weight: 600; fill: #111827; letter-spacing: -0.5px; }
            .description { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 400; fill: #4b5563; line-height: 1.6; }
        </style>
    </defs>

    <!-- Background -->
    <rect id="background" width="1600" height="1000" class="bg" />

    <!-- Header Section (16:10 wide) -->
    <text id="dash_title" x="100" y="120" class="title"></text>
    <text id="dash_subtitle" x="100" y="160" class="label"></text>

    <!-- Main Timeline Track -->
    <!-- Base track -->
    <path class="line" d="M 150 500 L 1450 500" />

    <!-- Active track overlay -->
    <path id="timeline_progress" class="line-active" d="M 150 500 L 800 500" />

    <!-- Timeline Nodes & Content Cards -->

    <!-- Phase 1 -->
    <g id="phase_1">
        <circle id="dot_p1" cx="200" cy="500" r="16" class="node-active" />
        <rect id="bg_p1" x="100" y="240" width="300" height="200" class="card" />
        <text id="label_p1" x="140" y="300" class="label-active"></text>
        <text id="val_p1" x="140" y="360" class="metric"></text>
        <text id="desc_p1" x="140" y="400" class="description"></text>
        <path d="M 200 440 L 200 484" fill="none" stroke="#111827" stroke-width="2" stroke-dasharray="4 4" />
    </g>

    <!-- Phase 2 (Alternating Down) -->
    <g id="phase_2">
        <circle id="dot_p2" cx="500" cy="500" r="16" class="node-active" />
        <rect id="bg_p2" x="400" y="560" width="300" height="200" class="card" />
        <text id="label_p2" x="440" y="620" class="label-active"></text>
        <text id="val_p2" x="440" y="680" class="metric"></text>
        <text id="desc_p2" x="440" y="720" class="description"></text>
        <path d="M 500 516 L 500 560" fill="none" stroke="#111827" stroke-width="2" stroke-dasharray="4 4" />
    </g>

    <!-- Phase 3 (Active State) -->
    <g id="phase_3">
        <circle id="dot_p3" cx="800" cy="500" r="20" class="node-active" fill="#ffffff" stroke-width="6" />
        <circle cx="800" cy="500" r="8" fill="#111827" />
        <rect id="bg_p3" x="700" y="240" width="300" height="200" class="card" stroke="#111827" stroke-width="2" />
        <text id="label_p3" x="740" y="300" class="label-active"></text>
        <text id="val_p3" x="740" y="360" class="metric"></text>
        <text id="desc_p3" x="740" y="400" class="description"></text>
        <path d="M 800 440 L 800 480" fill="none" stroke="#111827" stroke-width="2" />
    </g>

    <!-- Phase 4 (Future State) -->
    <g id="phase_4">
        <circle id="dot_p4" cx="1100" cy="500" r="16" class="node" />
        <rect id="bg_p4" x="1000" y="560" width="300" height="200" class="card" stroke-dasharray="8 8" />
        <text id="label_p4" x="1040" y="620" class="label"></text>
        <text id="val_p4" x="1040" y="680" class="metric" fill="#9ca3af"></text>
        <text id="desc_p4" x="1040" y="720" class="description" fill="#9ca3af"></text>
        <path d="M 1100 516 L 1100 560" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4" />
    </g>

    <!-- Phase 5 (End Goal) -->
    <g id="phase_5">
        <circle id="dot_p5" cx="1400" cy="500" r="16" class="node" />
        <rect id="bg_p5" x="1300" y="240" width="200" height="200" class="card" stroke-dasharray="8 8" />
        <text id="label_p5" x="1340" y="300" class="label"></text>
        <text id="val_p5" x="1340" y="360" class="metric" fill="#9ca3af"></text>
        <path d="M 1400 440 L 1400 484" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4" />
    </g>

</svg>