<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
    <defs>
        <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </radialGradient>
        <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="path-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .bg { fill: url(#bg-glow); }
            .node { fill: #38bdf8; stroke: #0284c7; stroke-width: 2; }
            .node-primary { fill: #f472b6; stroke: #db2777; stroke-width: 4; }
            .node-secondary { fill: #818cf8; stroke: #4f46e5; stroke-width: 3; }
            .edge { stroke: #1e293b; stroke-width: 1.5; fill: none; }
            .edge-active { stroke: #38bdf8; stroke-width: 2; stroke-opacity: 0.6; fill: none; }
            .card { fill: #1e293b; fill-opacity: 0.8; stroke: #334155; stroke-width: 1; rx: 8; ry: 8; }
            .text-title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 600; }
            .text-metric { fill: #38bdf8; font-family: system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 700; }
            .text-body { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
        </style>
    </defs>

    <rect class="bg" width="1600" height="1000" />

    <!-- Constellation Edges -->
    <g id="edges">
        <!-- Background faint connections -->
        <path class="edge" d="M300 300 Q450 400 600 500 T900 600" />
        <path class="edge" d="M600 200 Q750 350 800 500 T1200 400" />
        <path class="edge" d="M200 700 Q400 800 600 500 T1100 800" />
        <path class="edge" d="M1300 200 Q1100 350 800 500 T400 200" />
        <path class="edge" d="M300 300 L200 700 L600 500 L800 500" />
        <path class="edge" d="M900 600 L1100 800 L1400 700 L1200 400" />

        <!-- Active glowing connections -->
        <path class="edge-active" d="M600 500 Q700 450 800 500 T1200 400" filter="url(#path-glow)" />
        <path class="edge-active" d="M800 500 Q950 550 900 600 T1100 800" filter="url(#path-glow)" />
        <path class="edge-active" d="M600 500 Q450 650 200 700" filter="url(#path-glow)" />
        <path class="edge-active" d="M800 500 L900 300 L1300 200" filter="url(#path-glow)" />
    </g>

    <!-- Constellation Nodes -->
    <g id="nodes">
        <!-- Central Hub -->
        <circle id="node-center" class="node-primary" cx="800" cy="500" r="24" filter="url(#node-glow)" />

        <!-- Major Nodes -->
        <circle id="node-major-1" class="node-secondary" cx="600" cy="500" r="16" filter="url(#node-glow)" />
        <circle id="node-major-2" class="node-secondary" cx="900" cy="600" r="16" filter="url(#node-glow)" />
        <circle id="node-major-3" class="node-secondary" cx="1200" cy="400" r="16" filter="url(#node-glow)" />

        <!-- Minor Nodes -->
        <circle id="node-minor-1" class="node" cx="300" cy="300" r="8" />
        <circle id="node-minor-2" class="node" cx="200" cy="700" r="8" />
        <circle id="node-minor-3" class="node" cx="400" cy="200" r="8" />
        <circle id="node-minor-4" class="node" cx="600" cy="200" r="8" />
        <circle id="node-minor-5" class="node" cx="900" cy="300" r="8" />
        <circle id="node-minor-6" class="node" cx="1300" cy="200" r="8" />
        <circle id="node-minor-7" class="node" cx="1400" cy="700" r="8" />
        <circle id="node-minor-8" class="node" cx="1100" cy="800" r="8" />
    </g>

    <!-- Data Callout Cards -->
    <g id="callouts">
        <!-- Top Left Metric -->
        <g id="metric-1" transform="translate(100, 100)">
            <rect id="metric-1-bg" class="card" width="280" height="120" />
            <text id="metric-1-title" class="text-body" x="24" y="40"></text>
            <text id="metric-1-value" class="text-metric" x="24" y="85"></text>
        </g>

        <!-- Top Right Metric -->
        <g id="metric-2" transform="translate(1220, 100)">
            <rect id="metric-2-bg" class="card" width="280" height="120" />
            <text id="metric-2-title" class="text-body" x="24" y="40"></text>
            <text id="metric-2-value" class="text-metric" x="24" y="85"></text>
        </g>

        <!-- Bottom Left Metric -->
        <g id="metric-3" transform="translate(100, 780)">
            <rect id="metric-3-bg" class="card" width="280" height="120" />
            <text id="metric-3-title" class="text-body" x="24" y="40"></text>
            <text id="metric-3-value" class="text-metric" x="24" y="85"></text>
        </g>

        <!-- Bottom Right Info Box -->
        <g id="info-box" transform="translate(1100, 780)">
            <rect id="info-box-bg" class="card" width="400" height="120" />
            <text id="info-box-title" class="text-title" x="30" y="45"></text>
            <text id="info-box-desc" class="text-body" x="30" y="80"></text>
        </g>
    </g>
</svg>