<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #f1f5f9; }
            .orbit-ring { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
            .center-orb { fill: #3b82f6; filter: drop-shadow(0 15px 30px rgba(59,130,246,0.3)); }
            .orb-text { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 30px; font-weight: 800; text-anchor: middle; alignment-baseline: middle; }
            .satellite-card {
                fill: rgba(255, 255, 255, 0.7);
                rx: 50;
                ry: 50;
                stroke: rgba(255, 255, 255, 0.5);
                stroke-width: 1.5;
                filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.1)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0));
                transition: transform 0.3s; cursor: pointer;
            }
            .satellite-title { fill: #374151; font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; alignment-baseline: middle; }
            .satellite-metric { fill: #3b82f6; font-family: system-ui, sans-serif; font-size: 25px; font-weight: 800; text-anchor: middle; alignment-baseline: middle; }
        </style>

        <!-- Soft Mesh Gradient Blob Background for Glassmorphism effect -->
        <filter id="blurFilter">
            <feGaussianBlur stdDeviation="80" />
        </filter>
        <radialGradient id="meshGradient1" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#bfdbfe" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>
        <radialGradient id="meshGradient2" cx="70%" cy="70%" r="50%">
            <stop offset="0%" stop-color="#e9d5ff" />
            <stop offset="100%" stop-color="transparent" />
        </radialGradient>
    </defs>

    <rect id="background" class="bg" width="1600" height="1000" />
    <circle cx="400" cy="250" r="500" fill="url(#meshGradient1)" filter="url(#blurFilter)" opacity="0.8" />
    <circle cx="1200" cy="750" r="500" fill="url(#meshGradient2)" filter="url(#blurFilter)" opacity="0.6" />

    <!-- Orbit Rings -->
    <circle class="orbit-ring" cx="800" cy="500" r="250" />
    <circle class="orbit-ring" cx="800" cy="500" r="400" />

    <!-- Center Hub -->
    <g id="radial-center">
        <circle class="center-orb" cx="800" cy="500" r="100" />
        <text id="text_hub" class="orb-text" x="800" y="500"></text>
        <circle cx="800" cy="500" r="90" fill="transparent" id="radial-center-data" />
    </g>

    <g id="sat-inner-1">
        <circle class="satellite-card" cx="800" cy="250" r="80" />
        <text id="text_sys_a" class="satellite-title" x="800" y="240"></text>
        <text id="val_sys_a" class="satellite-metric" x="800" y="270"></text>
        <circle cx="800" cy="250" r="72" fill="transparent" id="sat-inner-1-data"/>
    </g>
    <g id="sat-inner-2">
        <circle class="satellite-card" cx="1016.5" cy="625" r="80" />
        <text id="text_sys_b" class="satellite-title" x="1016.5" y="615"></text>
        <text id="val_sys_b" class="satellite-metric" x="1016.5" y="645"></text>
        <circle cx="1016.5" cy="625" r="72" fill="transparent" id="sat-inner-2-data"/>
    </g>
    <g id="sat-inner-3">
        <circle class="satellite-card" cx="583.5" cy="625" r="80" />
        <text id="text_sys_c" class="satellite-title" x="583.5" y="615"></text>
        <text id="val_sys_c" class="satellite-metric" x="583.5" y="645"></text>
        <circle cx="583.5" cy="625" r="72" fill="transparent" id="sat-inner-3-data"/>
    </g>
    <g id="sat-outer-1">
        <circle class="satellite-card" cx="800" cy="100" r="60" />
        <text id="text_ext_1" class="satellite-title" x="800" y="95"></text>
        <text id="val_ext_1" class="satellite-metric" x="800" y="115"></text>
        <rect fill="transparent" x="740" y="40" width="120" height="120" id="sat-outer-1-data"/>
    </g>
    <g id="sat-outer-2">
        <circle class="satellite-card" cx="1146.4" cy="300" r="60" />
        <text id="text_ext_2" class="satellite-title" x="1146.4" y="295"></text>
        <text id="val_ext_2" class="satellite-metric" x="1146.4" y="315"></text>
        <rect fill="transparent" x="1086.4" y="240" width="120" height="120" id="sat-outer-2-data"/>
    </g>
    <g id="sat-outer-3">
        <circle class="satellite-card" cx="1146.4" cy="700" r="60" />
        <text id="text_ext_3" class="satellite-title" x="1146.4" y="695"></text>
        <text id="val_ext_3" class="satellite-metric" x="1146.4" y="715"></text>
        <rect fill="transparent" x="1086.4" y="640" width="120" height="120" id="sat-outer-3-data"/>
    </g>
    <g id="sat-outer-4">
        <circle class="satellite-card" cx="800" cy="900" r="60" />
        <text id="text_ext_4" class="satellite-title" x="800" y="895"></text>
        <text id="val_ext_4" class="satellite-metric" x="800" y="915"></text>
        <rect fill="transparent" x="740" y="840" width="120" height="120" id="sat-outer-4-data"/>
    </g>
    <g id="sat-outer-5">
        <circle class="satellite-card" cx="453.6" cy="700" r="60" />
        <text id="text_ext_5" class="satellite-title" x="453.6" y="695"></text>
        <text id="val_ext_5" class="satellite-metric" x="453.6" y="715"></text>
        <rect fill="transparent" x="393.6" y="640" width="120" height="120" id="sat-outer-5-data"/>
    </g>
    <g id="sat-outer-6">
        <circle class="satellite-card" cx="453.6" cy="300" r="60" />
        <text id="text_ext_6" class="satellite-title" x="453.6" y="295"></text>
        <text id="val_ext_6" class="satellite-metric" x="453.6" y="315"></text>
        <rect fill="transparent" x="393.6" y="240" width="120" height="120" id="sat-outer-6-data"/>
    </g>
</svg>