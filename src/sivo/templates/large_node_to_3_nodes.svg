<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f0f4f8; }
      .line { stroke: #cbd5e1; stroke-width: 4; stroke-dasharray: 8 8; }
      .node { fill: #ffffff; stroke: #3b82f6; stroke-width: 4; rx: 20; ry: 20; }
      .large-node { fill: #ffffff; stroke: #3b82f6; stroke-width: 6; rx: 40; ry: 40; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 8; ry: 8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
    </style>
  </defs>

  <rect class="bg" width="1000" height="1000" />

  <rect id="header_area" class="card" x="50" y="40" width="900" height="120" />

  <!-- Central large node on the left -->
  <circle id="large_node_dot" class="large-node" cx="200" cy="500" r="60" />

  <!-- Lines from large node to 3 nodes on the right -->
  <!-- Line 1 -->
  <line class="line" x1="260" y1="500" x2="600" y2="300" />
  <!-- Line 2 -->
  <line class="line" x1="260" y1="500" x2="600" y2="500" />
  <!-- Line 3 -->
  <line class="line" x1="260" y1="500" x2="600" y2="700" />

  <!-- Node 1 -->
  <circle id="node_1_dot" class="node" cx="600" cy="300" r="20" />
  <rect id="node_1_card" class="card" x="650" y="240" width="300" height="120" />

  <!-- Node 2 -->
  <circle id="node_2_dot" class="node" cx="600" cy="500" r="20" />
  <rect id="node_2_card" class="card" x="650" y="440" width="300" height="120" />

  <!-- Node 3 -->
  <circle id="node_3_dot" class="node" cx="600" cy="700" r="20" />
  <rect id="node_3_card" class="card" x="650" y="640" width="300" height="120" />

</svg>
