<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVO Serverless Browser App</title>
    <script>
        if (window.location.protocol === 'file:') {
            alert('Error: You are loading this file directly from the filesystem (file://).\n\nWeb browsers enforce strict security policies that prevent loading external files (like the Annotator tool) from local paths.\n\nPlease start a local HTTP server from the root of the repository instead:\n\ncd ../../\npython -m http.server 8000\n\nThen visit http://localhost:8000/examples/web_app/index.html');
        }
    </script>
    <!-- Load Pyodide from CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f8fafc; }
        header { background: #0f172a; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #cbd5e1; }
        .panel:last-child { border-right: none; }
        .panel-header { background: #e2e8f0; padding: 10px; font-weight: bold; border-bottom: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: white; }
        textarea { flex: 1; border: none; padding: 10px; font-family: monospace; resize: none; outline: none; background: #1e293b; color: #f8fafc; font-size: 14px; }
        button { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover { background: #2563eb; }
        #status { font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <header>
        <h2>SIVO Serverless App (100% WASM)</h2>
        <div id="status">Initializing Pyodide...</div>
    </header>

    <div class="main-content">
        <!-- Pane 1: SIVO Annotator Tool -->
        <div class="panel" style="flex: 1.5;">
            <div class="panel-header">
                1. Draw SVG Template
                <span style="font-size: 12px; font-weight: normal; color: #64748b;">(Saves directly to IDBFS)</span>
            </div>
            <!-- The annotator tool automatically detects `window.parent.pyodide` and enables the IDBFS save button -->
            <iframe src="../../src/sivo/cli/tools/annotator.html" id="annotator-frame"></iframe>
        </div>

        <!-- Pane 2: Python Code -->
        <div class="panel" style="flex: 1;">
            <div class="panel-header">
                2. Write Python Logic
                <button id="run-btn" disabled>Run SIVO</button>
            </div>
            <textarea id="python-code" spellcheck="false">
import os
from sivo import Sivo

# 1. Read the SVG template you just saved in the Annotator
template_path = "/sivo_workspace/sivo_template.svg"

if not os.path.exists(template_path):
    print("Template not found! Please draw a shape in the Annotator and click 'Save to Pyodide FS'.")
else:
    # 2. Load it into SIVO
    app = Sivo.from_svg(template_path)

    # 3. Add a background image (replace with your image URL)
    # app.add_background_image("https://example.com/image.jpg")

    # 4. Map interactions to the shapes you drew
    # Replace 'shape_1' with the actual ID you gave your shape in the Annotator
    app.map("shape_1", tooltip="Hello from WASM!", color="rgba(59, 130, 246, 0.5)", hover_color="rgba(59, 130, 246, 0.8)")

    # 5. Export to HTML string
    html_output = app.to_html()

    # Send the HTML string to Javascript
    import js
    js.renderOutput(html_output)
            </textarea>
        </div>

        <!-- Pane 3: Output Render -->
        <div class="panel" style="flex: 1.5;">
            <div class="panel-header">
                3. Interactive Output
            </div>
            <iframe id="output-frame"></iframe>
        </div>
    </div>

    <script>
        let pyodide;
        const statusEl = document.getElementById('status');
        const runBtn = document.getElementById('run-btn');
        const codeInput = document.getElementById('python-code');
        const outputFrame = document.getElementById('output-frame');

        // This function is called by Python (`js.renderOutput`)
        window.renderOutput = function(htmlString) {
            outputFrame.srcdoc = htmlString;
        };

        async function initApp() {
            try {
                // 1. Load Pyodide
                pyodide = await loadPyodide();

                // Expose pyodide globally so the iframe annotator can find it (`window.parent.pyodide`)
                window.pyodide = pyodide;

                statusEl.innerText = 'Mounting IDBFS...';

                // 2. Mount IndexedDB File System (IDBFS) for persistence
                const mountDir = "/sivo_workspace";
                try {
                    pyodide.FS.mkdir(mountDir);
                } catch (e) {
                    if (e.code !== 'EEXIST') throw e;
                }
                pyodide.FS.mount(pyodide.FS.filesystems.IDBFS, {}, mountDir);

                // Sync from IndexedDB into memory
                await new Promise((resolve, reject) => {
                    pyodide.FS.syncfs(true, function(err) {
                        if (err) reject(err);
                        else resolve();
                    });
                });

                statusEl.innerText = 'Installing SIVO...';

                // 3. Load SIVO's core dependencies from Pyodide's pre-compiled wheel repository
                await pyodide.loadPackage("micropip");
                const micropip = pyodide.pyimport("micropip");

                // Install dependencies (lxml is a C-extension, but Pyodide provides it)
                await micropip.install(['lxml', 'pydantic', 'Jinja2']);

                // 4. Install SIVO from local source (or a published wheel)
                // For this example to work locally, we zip the src directory and install it
                // In production, you would build a .whl file and host it statically: `await micropip.install('./sivo-0.1.0-py3-none-any.whl')`

                statusEl.innerText = 'Ready!';
                runBtn.disabled = false;

                // Note: Since we are running raw local files in this example without a wheel,
                // we'll inject the SIVO module directly into the virtual file system for testing.
                // See README.md for production wheel instructions.

            } catch (err) {
                console.error(err);
                statusEl.innerText = 'Error: Check console.';
                statusEl.style.color = '#ef4444';
            }
        }

        runBtn.addEventListener('click', async () => {
            if (!pyodide) return;

            runBtn.disabled = true;
            runBtn.innerText = 'Running...';
            outputFrame.srcdoc = "<html><body><div style='padding:20px; font-family:sans-serif;'>Generating interactive map...</div></body></html>";

            try {
                // Run the Python code
                await pyodide.runPythonAsync(codeInput.value);
            } catch (err) {
                console.error(err);
                outputFrame.srcdoc = `<html><body><pre style='color:red; padding:20px; white-space:pre-wrap;'>${err.message}</pre></body></html>`;
            } finally {
                runBtn.disabled = false;
                runBtn.innerText = 'Run SIVO';
            }
        });

        // Start initialization
        initApp();
    </script>
</body>
</html>
