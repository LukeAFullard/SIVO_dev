<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVO Serverless Browser App</title>
    <!-- Load Pyodide from CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f8fafc; }
        header { background: #0f172a; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; background: #1e293b; }
        .tab-btn { background: none; border: none; color: #94a3b8; padding: 12px 24px; font-size: 14px; cursor: pointer; font-weight: bold; transition: color 0.2s; }
        .tab-btn.active { color: white; border-bottom: 2px solid #38bdf8; }
        .tab-btn:hover { color: #f8fafc; }
        .main-content { display: none; flex: 1; overflow: hidden; }
        .main-content.active { display: flex; }
        .panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #cbd5e1; }
        .panel:last-child { border-right: none; }
        .panel-header { background: #e2e8f0; padding: 10px; font-weight: bold; border-bottom: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: white; }
        textarea { flex: 1; border: none; padding: 10px; font-family: monospace; resize: none; outline: none; background: #1e293b; color: #f8fafc; font-size: 14px; line-height: 1.5; }
        button.action-btn { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button.action-btn:hover { background: #2563eb; }
        button.action-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <header>
        <h2>SIVO Serverless App (100% WASM)</h2>
        <div id="status">Initializing Pyodide...</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('annotator')">🎨 Annotator Studio</button>
        <button class="tab-btn" onclick="switchTab('workspace')">💻 Python Workspace</button>
    </div>

    <!-- View 1: Annotator -->
    <div id="view-annotator" class="main-content active">
        <div class="panel" style="flex: 1;">
            <div class="panel-header">
                1. Draw SVG Template
                <span style="font-size: 12px; font-weight: normal; color: #64748b;">(Click "Save to Pyodide FS" to make your template available to the Python Workspace)</span>
            </div>
            <!-- The annotator tool automatically detects `window.parent.pyodide` and enables the IDBFS save button -->
            <iframe id="annotator-frame"></iframe>
        </div>
    </div>

    <!-- View 2: Python Workspace -->
    <div id="view-workspace" class="main-content">
        <!-- Pane 1.5: File Manager Sidebar -->
        <div class="panel" style="flex: 0.5; max-width: 250px; background: #f1f5f9;">
            <div class="panel-header" style="background: #cbd5e1;">
                File Manager
            </div>
            <div style="padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto;" id="file-manager-dropzone">
                <p style="margin: 0; color: #475569;">/sivo_workspace</p>
                <div id="file-list" style="flex: 1; border: 1px solid #cbd5e1; background: white; padding: 5px; border-radius: 4px; overflow-y: auto;">
                    <div style="color: #94a3b8; font-style: italic;">Loading...</div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; color: #334155;">Upload File:</label>
                    <input type="file" id="file-upload" style="font-size: 12px;" />
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; color: #334155;">Fetch from URL:</label>
                    <input type="text" id="url-fetch-input" placeholder="https://..." style="padding: 4px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 2px;" />
                    <button id="url-fetch-btn" class="action-btn" style="padding: 4px 8px; font-size: 12px;">Fetch URL</button>
                </div>
            </div>
        </div>

        <!-- Pane 2: Python Code -->
        <div class="panel" style="flex: 1;">
            <div class="panel-header">
                2. Write Python Logic
                <button id="run-btn" class="action-btn" disabled>Run SIVO</button>
            </div>
            <textarea id="python-code" spellcheck="false">
import os
from sivo import Sivo

# 1. Read the SVG template you just saved in the Annotator
template_path = "/sivo_workspace/sivo_template.svg"

if not os.path.exists(template_path):
    print("Template not found! Please draw a shape in the Annotator and click 'Save to Pyodide FS'.")
else:
    # 2. Load it into SIVO
    app = Sivo.from_svg(template_path)

    # 3. Add a background image (replace with your image URL)
    # app.add_background_image("https://example.com/image.jpg")

    # 4. Map interactions to the shapes you drew
    # Replace 'shape_1' with the actual ID you gave your shape in the Annotator
    app.map("shape_1", tooltip="Hello from WASM!", color="rgba(59, 130, 246, 0.5)", hover_color="rgba(59, 130, 246, 0.8)")

    # 5. Export to HTML string
    html_output = app.to_html()

    # Send the HTML string to Javascript
    import js
    js.renderOutput(html_output)
            </textarea>
        </div>

        <!-- Pane 3: Output Render -->
        <div class="panel" style="flex: 1.5;">
            <div class="panel-header">
                3. Interactive Output
            </div>
            <iframe id="output-frame"></iframe>
        </div>
    </div>

    <!-- Raw Annotator HTML Template embedded to bypass file:/// CORS restrictions -->
    <template id="annotator-template">
        <!-- ANNOTATOR_TEMPLATE_PLACEHOLDER -->
    </template>

    <script>
        // Inject the Annotator UI safely into the iframe
        const template = document.getElementById('annotator-template').innerHTML;
        const iframe = document.getElementById('annotator-frame');
        iframe.srcdoc = template;

        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('view-' + tabId).classList.add('active');

            // Highlight button
            const buttons = document.querySelectorAll('.tab-btn');
            if (tabId === 'annotator') buttons[0].classList.add('active');
            if (tabId === 'workspace') buttons[1].classList.add('active');
        }

        let pyodide;
        const statusEl = document.getElementById('status');
        const runBtn = document.getElementById('run-btn');
        const codeInput = document.getElementById('python-code');
        const outputFrame = document.getElementById('output-frame');

        // This function is called by Python (`js.renderOutput`)
        window.renderOutput = function(htmlString) {
            outputFrame.srcdoc = htmlString;
        };

        async function initApp() {
            try {
                // 1. Load Pyodide
                pyodide = await loadPyodide();

                // Expose pyodide globally so the iframe annotator can find it (`window.parent.pyodide`)
                window.pyodide = pyodide;

                statusEl.innerText = 'Mounting IDBFS...';

                // 2. Mount IndexedDB File System (IDBFS) for persistence
                const mountDir = "/sivo_workspace";
                try {
                    pyodide.FS.mkdir(mountDir);
                } catch (e) {
                    if (e.code !== 'EEXIST') throw e;
                }
                pyodide.FS.mount(pyodide.FS.filesystems.IDBFS, {}, mountDir);

                // Sync from IndexedDB into memory
                await new Promise((resolve, reject) => {
                    pyodide.FS.syncfs(true, function(err) {
                        if (err) reject(err);
                        else resolve();
                    });
                });
                updateFileList();

                statusEl.innerText = 'Installing SIVO...';

                // 3. Load SIVO's core dependencies from Pyodide's pre-compiled wheel repository
                await pyodide.loadPackage("micropip");
                const micropip = pyodide.pyimport("micropip");

                // Install dependencies (lxml is a C-extension, but Pyodide provides it)
                await micropip.install(['lxml', 'pydantic', 'Jinja2']);

                // 4. Install SIVO from local source (or a published wheel)
                // For this example to work locally, we zip the src directory and install it
                // In production, you would build a .whl file and host it statically: `await micropip.install('./sivo-0.1.0-py3-none-any.whl')`
                if (window.location.protocol === 'file:') {
                    console.warn('Running from file:// protocol. Loading local Python wheels via micropip.install("./sivo.whl") will fail due to browser CORS policies. Please start a local HTTP server to fully test the SIVO Python backend.');
                }

                statusEl.innerText = 'Ready!';
                runBtn.disabled = false;

            } catch (err) {
                console.error(err);
                statusEl.innerText = 'Error: Check console.';
                statusEl.style.color = '#ef4444';
            }
        }

        runBtn.addEventListener('click', async () => {
            if (!pyodide) return;

            runBtn.disabled = true;
            runBtn.innerText = 'Running...';
            outputFrame.srcdoc = "<html><body><div style='padding:20px; font-family:sans-serif;'>Generating interactive map...</div></body></html>";

            try {
                // Run the Python code
                await pyodide.runPythonAsync(codeInput.value);
            } catch (err) {
                console.error(err);
                outputFrame.srcdoc = `<html><body><pre style='color:red; padding:20px; white-space:pre-wrap;'>${err.message}</pre></body></html>`;
            } finally {
                runBtn.disabled = false;
                runBtn.innerText = 'Run SIVO';
            }
        });

        function updateFileList() {
            if (!pyodide) return;
            const mountDir = "/sivo_workspace";
            const fileListEl = document.getElementById('file-list');
            try {
                const files = pyodide.FS.readdir(mountDir).filter(f => f !== '.' && f !== '..');
                if (files.length === 0) {
                    fileListEl.innerHTML = '<div style="color: #94a3b8; font-style: italic;">No files uploaded.</div>';
                } else {
                    fileListEl.innerHTML = files.map(f => `<div style="padding: 2px 0; word-break: break-all;">📄 ${f}</div>`).join('');
                }
            } catch (err) {
                console.error("Error reading directory", err);
            }
        }

        async function saveBufferToFS(filename, buffer) {
            try {
                const mountDir = "/sivo_workspace";

                // If it's an XLSX, ideally we would convert to CSV here to save Python memory,
                // but for now we'll write the raw file or handle it directly in Python if the user has openpyxl.
                // We'll write the raw bytes to IDBFS
                pyodide.FS.writeFile(`${mountDir}/${filename}`, new Uint8Array(buffer));

                await new Promise((resolve, reject) => {
                    pyodide.FS.syncfs(false, function(err) {
                        if (err) reject(err);
                        else resolve();
                    });
                });
                updateFileList();
            } catch (err) {
                console.error("Error saving file to IDBFS:", err);
                alert("Error saving file: " + err.message);
            }
        }

        document.getElementById('file-upload').addEventListener('change', async (e) => {
            if (!pyodide) return;
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (evt) => {
                let buffer = evt.target.result;
                await saveBufferToFS(file.name, buffer);
                buffer = null; // Memory cleanup
                e.target.value = ''; // Reset input
            };
            reader.readAsArrayBuffer(file);
        });

        const dropzone = document.getElementById('file-manager-dropzone');
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.style.backgroundColor = '#e2e8f0';
        });
        dropzone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropzone.style.backgroundColor = '';
        });
        dropzone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropzone.style.backgroundColor = '';
            if (!pyodide) return;

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    let buffer = evt.target.result;
                    await saveBufferToFS(file.name, buffer);
                    buffer = null; // Memory cleanup
                };
                reader.readAsArrayBuffer(file);
            }
        });

        document.getElementById('url-fetch-btn').addEventListener('click', async () => {
            if (!pyodide) return;
            const urlInput = document.getElementById('url-fetch-input');
            const url = urlInput.value.trim();
            if (!url) return;

            const btn = document.getElementById('url-fetch-btn');
            const originalText = btn.innerText;
            btn.innerText = 'Fetching...';
            btn.disabled = true;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                let buffer = await response.arrayBuffer();

                // Extract filename from URL or use a default
                let filename = url.split('/').pop().split('?')[0] || 'downloaded_file';

                await saveBufferToFS(filename, buffer);
                buffer = null; // Memory cleanup
                urlInput.value = '';
            } catch (err) {
                console.error("Error fetching URL:", err);
                alert("Failed to fetch URL: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // Start initialization
        initApp();
    </script>
</body>
</html>
