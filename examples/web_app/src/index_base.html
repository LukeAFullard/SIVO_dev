<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVO Serverless Browser App</title>
    <!-- Load Pyodide from CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        /* MAIN_CSS_PLACEHOLDER */
    </style>
</head>
<body>

    <header>
        <h2>SIVO Serverless App (100% WASM)</h2>
        <div id="status">Initializing Pyodide...</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('annotator')">🎨 Annotator Studio</button>
        <button class="tab-btn" onclick="switchTab('workspace')">💻 Python Workspace</button>
    </div>

    <!-- View 1: Annotator -->
    <div id="view-annotator" class="main-content active">
        <div class="panel" style="flex: 1;">
            <div class="panel-header">
                1. Draw SVG Template
                <span style="font-size: 12px; font-weight: normal; color: #64748b;">(Click "Save to Pyodide FS" to make your template available to the Python Workspace)</span>
            </div>
            <!-- The annotator tool automatically detects `window.parent.pyodide` and enables the IDBFS save button -->
            <iframe id="annotator-frame"></iframe>
        </div>
    </div>

    <!-- View 2: Python Workspace -->
    <div id="view-workspace" class="main-content">
        <!-- Pane 1.5: File Manager Sidebar -->
        <div class="panel" style="flex: 0.5; max-width: 250px; background: #f1f5f9;">
            <div class="panel-header" style="background: #cbd5e1;">
                File Manager
            </div>
            <div style="padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto;" id="file-manager-dropzone">
                <p style="margin: 0; color: #475569;">/sivo_workspace</p>
                <div id="file-list" style="flex: 1; border: 1px solid #cbd5e1; background: white; padding: 5px; border-radius: 4px; overflow-y: auto;">
                    <div style="color: #94a3b8; font-style: italic;">Loading...</div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; color: #334155;">Upload File:</label>
                    <input type="file" id="file-upload" style="font-size: 12px;" />
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: bold; color: #334155;">Fetch from URL:</label>
                    <input type="text" id="url-fetch-input" placeholder="https://..." style="padding: 4px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 2px;" />
                    <button id="url-fetch-btn" class="action-btn" style="padding: 4px 8px; font-size: 12px;">Fetch URL</button>
                </div>
            </div>
        </div>

        <!-- Pane 2: Python Code -->
        <div class="panel" style="flex: 1;">
            <div class="panel-header">
                2. Write Python Logic
                <button id="run-btn" class="action-btn" disabled>Run SIVO</button>
            </div>
            <textarea id="python-code" spellcheck="false">
import os
from sivo import Sivo

# 1. Read the SVG template you just saved in the Annotator
template_path = "/sivo_workspace/sivo_template.svg"

if not os.path.exists(template_path):
    print("Template not found! Please draw a shape in the Annotator and click 'Save to Pyodide FS'.")
else:
    # 2. Load it into SIVO
    app = Sivo.from_svg(template_path)

    # 3. Add a background image (replace with your image URL)
    # app.add_background_image("https://example.com/image.jpg")

    # 4. Map interactions to the shapes you drew
DEFAULT_CODE_PLACEHOLDER

    <script>
    <script>
        // MAIN_JS_PLACEHOLDER
    </script>
    </script>
</body>
</html>
