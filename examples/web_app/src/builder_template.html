<div class="flex h-full w-full bg-slate-50 text-slate-900 font-sans">
    <!-- Sidebar: Tools & Templates -->
    <div class="w-64 border-r border-slate-200 bg-white flex flex-col">
        <div class="p-4 border-b border-slate-200 bg-slate-100 font-semibold text-slate-700">
            Project Setup
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Visual Template Selector -->
            <div>
                <h3 class="text-sm font-bold text-slate-500 mb-2 uppercase tracking-wider">Templates</h3>
                <div class="space-y-2">
                    <button class="w-full text-left px-3 py-2 text-sm border border-slate-200 rounded hover:bg-slate-50 hover:border-blue-400 transition-colors">
                        Blank Canvas
                    </button>
                    <button class="w-full text-left px-3 py-2 text-sm border border-slate-200 rounded hover:bg-slate-50 hover:border-blue-400 transition-colors">
                        US Map Choropleth
                    </button>
                    <button class="w-full text-left px-3 py-2 text-sm border border-slate-200 rounded hover:bg-slate-50 hover:border-blue-400 transition-colors">
                        World Map Dashboard
                    </button>
                </div>
            </div>

            <!-- JSON Import -->
            <div>
                <h3 class="text-sm font-bold text-slate-500 mb-2 uppercase tracking-wider">Import/Export</h3>
                <button class="w-full px-3 py-2 text-sm bg-blue-50 text-blue-600 border border-blue-200 rounded hover:bg-blue-100 transition-colors font-medium">
                    Load JSON Config
                </button>
            </div>

            <!-- History / Undo Redo -->
            <div>
                <h3 class="text-sm font-bold text-slate-500 mb-2 uppercase tracking-wider">History</h3>
                <div class="flex space-x-2">
                    <button class="flex-1 px-3 py-1.5 text-sm bg-slate-100 border border-slate-200 rounded hover:bg-slate-200 text-slate-600 disabled:opacity-50">
                        Undo
                    </button>
                    <button class="flex-1 px-3 py-1.5 text-sm bg-slate-100 border border-slate-200 rounded hover:bg-slate-200 text-slate-600 disabled:opacity-50">
                        Redo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Center: Interactive Preview Pane -->
    <div class="flex-1 flex flex-col relative bg-slate-100">
        <div class="h-12 border-b border-slate-200 bg-white flex items-center justify-between px-4">
            <div class="font-semibold text-slate-700">Interactive Preview</div>
            <div class="space-x-2">
                <button class="px-3 py-1 text-sm bg-slate-100 border border-slate-200 rounded hover:bg-slate-200">
                    Refresh
                </button>
                <button class="px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 font-medium shadow-sm">
                    Generate Output
                </button>
            </div>
        </div>
        <div class="flex-1 p-4 flex items-center justify-center">
            <!-- Simulated iframe or canvas area -->
            <div class="w-full h-full bg-white border border-slate-300 shadow-sm rounded flex items-center justify-center text-slate-400 border-dashed">
                Preview Area (SIVO Output)
            </div>
        </div>
    </div>

    <!-- Right Sidebar: Property Inspector -->
    <div class="w-80 border-l border-slate-200 bg-white flex flex-col">
        <div class="p-4 border-b border-slate-200 bg-slate-100 font-semibold text-slate-700">
            Property Inspector
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-6">

            <!-- Element Selection -->
            <div>
                <label class="block text-sm font-bold text-slate-500 mb-1">Selected Element ID</label>
                <input type="text" placeholder="e.g. state-ny" class="w-full px-3 py-2 text-sm border border-slate-200 rounded bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Appearance -->
            <div>
                <h3 class="text-sm font-bold text-slate-500 border-b border-slate-200 pb-1 mb-3">Appearance</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">Fill Color</label>
                        <div class="flex space-x-2">
                            <input type="color" value="#3b82f6" class="h-8 w-8 rounded cursor-pointer border border-slate-200 p-0.5">
                            <input type="text" value="#3b82f6" class="flex-1 px-2 py-1 text-sm border border-slate-200 rounded">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">Hover Color</label>
                        <div class="flex space-x-2">
                            <input type="color" value="#60a5fa" class="h-8 w-8 rounded cursor-pointer border border-slate-200 p-0.5">
                            <input type="text" value="#60a5fa" class="flex-1 px-2 py-1 text-sm border border-slate-200 rounded">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Interactivity & Tooltips -->
            <div>
                <h3 class="text-sm font-bold text-slate-500 border-b border-slate-200 pb-1 mb-3">Interactivity</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">Rich HTML Tooltip</label>
                        <textarea rows="3" placeholder="<strong>Value:</strong> 100" class="w-full px-3 py-2 text-sm border border-slate-200 rounded bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="text-xs text-slate-600">Enforce Tooltip Z-Index</label>
                        <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="text-xs text-slate-600">Selective Hover Effects</label>
                        <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" checked>
                    </div>
                </div>
            </div>

            <!-- Actions & Callbacks -->
            <div>
                <h3 class="text-sm font-bold text-slate-500 border-b border-slate-200 pb-1 mb-3">Actions</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">On Click Callback</label>
                        <select class="w-full px-3 py-2 text-sm border border-slate-200 rounded bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>None</option>
                            <option>Zoom to Element</option>
                            <option>Toggle Image Action</option>
                            <option>Show Footnote</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">Hover Callback</label>
                        <select class="w-full px-3 py-2 text-sm border border-slate-200 rounded bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>None</option>
                            <option>Update Context Panel</option>
                        </select>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
