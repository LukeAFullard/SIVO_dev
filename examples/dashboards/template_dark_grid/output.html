<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Server Status</title>

    <!-- Include ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary-color: #38bdf8;
            --accent-color: #818cf8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .header-controls {
            display: flex;
            gap: 1rem;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary-color);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            padding: 1.5rem 2rem;
            flex: 1;
        }

        .sivo-card {
            background-color: var(--card-bg);
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 400px;
        }

        .html-card {
            background-color: var(--card-bg);
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sivo-container {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .sivo-native-overlay-svg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header::after {
            content: '...';
            color: var(--text-muted);
            font-size: 1.25rem;
            line-height: 0.5;
            cursor: pointer;
        }

        .card-content {
            padding: 1.25rem;
            flex: 1;
            overflow-y: auto;
            color: var(--text-muted);
        }

        /* Metrics styling */
        .sivo-metrics-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
        }

        .metric-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        /* Sliding Sidebar */
        #sivo-sliding-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 400px;
            max-width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            box-shadow: -4px 0 25px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        #sivo-sliding-sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-color);
        }

        .sidebar-close-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .sidebar-close-btn:hover {
            color: var(--text-color);
        }

        .sidebar-content {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
            color: var(--text-color);
        }

        /* Dark mode echarts tooltip override */
        .echarts-tooltip {
            background-color: rgba(30, 41, 59, 0.9) !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
            .sivo-card, .html-card, .sivo-details-panel, .sivo-metrics-panel {
                grid-column: 1 / -1 !important;
            }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <h1>Global Server Status</h1>
        <div class="header-controls">
            <span class="badge">Live Data</span>
        </div>
    </div>

    <div class="dashboard-container" id="dashboard-container">


            <div class="html-card" id="card-live_feed" style="grid-column: span 4;">
                <div class="card-content" id="container-live_feed">

    <div style="padding: 10px;">
        <h3 style="margin: 0; color: #f8fafc; font-size: 1.25rem;">Live Feed</h3>
        <p style="color: #94a3b8; margin-top: 5px; font-size: 0.875rem;">System latency updates every 5s</p>
    </div>

                </div>
            </div>



            <div class="sivo-card" id="card-global_network" style="grid-column: span 3;">
                <div class="card-header">Global Network</div>
                <div class="sivo-container" id="container-global_network">
                    <div id="chart-global_network" style="width: 100%; height: 100%;"></div>
                    <div id="overlay-global_network" class="sivo-native-overlay-svg-container"></div>
                </div>
            </div>



            <div class="html-card sivo-metrics-panel" id="card-server_metrics" data-block-id="server_metrics" style="grid-column: span 1;">
                <div class="card-header">Server Telemetry</div>
                <div class="card-content sivo-metrics-content" id="container-server_metrics">

                    <div class="metric-item">
                        <span class="metric-label">Cpu Load</span>
                        <span class="metric-value" data-metric-key="cpu_load">---</span>
                    </div>

                    <div class="metric-item">
                        <span class="metric-label">Active Connections</span>
                        <span class="metric-value" data-metric-key="active_connections">---</span>
                    </div>

                    <div class="metric-item">
                        <span class="metric-label">Bandwidth</span>
                        <span class="metric-value" data-metric-key="bandwidth">---</span>
                    </div>

                </div>
            </div>



            <div class="html-card sivo-details-panel" id="card-datacenter_logs" data-block-id="datacenter_logs" style="grid-column: span 4;">
                <div class="card-header">Node Logs</div>
                <div class="card-content sivo-details-content" id="container-datacenter_logs">
                    <p class="placeholder-text" style="text-align: center; margin-top: 2rem;">Select a region on the map to view live logs.</p>
                </div>
            </div>


    </div>

    <!-- Global Sliding Sidebar Overlay -->
    <div id="sivo-sliding-sidebar">
        <div class="sidebar-header">
            <h2 id="sidebar-title">Details</h2>
            <button class="sidebar-close-btn" onclick="closeSidebar()" title="Close">&times;</button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Dynamic content injected here -->
        </div>
    </div>

nimation": null, "morph_to_path": null, "morph_duration_ms": 1000, "morph_delay_ms": 0, "morph_easing": "ease-in-out", "morph_iterations": 1.0, "filter": null, "clip_path": null, "mask": null, "transform": null, "odometer_value": null, "odometer_duration_ms": 2000, "odometer_format": null}}, "metric_value_3": {"id": "metric_value_3", "actions": [], "context_menu": null, "open_by_default": false, "panel_position": null, "panel_css": null, "draggable": false, "theme": {"color": null, "hover_color": null, "fill_gradient": null, "fill_pattern": null, "border_width": null, "border_color": null, "transparent_lines": null, "glow": null, "animation": null, "morph_to_path": null, "morph_duration_ms": 1000, "morph_delay_ms": 0, "morph_easing": "ease-in-out", "morph_iterations": 1.0, "filter": null, "clip_path": null, "mask": null, "transform": null, "odometer_value": null, "odometer_duration_ms": 2000, "odometer_format": null}}}}};
        const activeCharts = {};

        function calculateLayoutSize(view, domElement) {
            if (!view || !view.layout_size || typeof view.layout_size !== 'string' || !view.layout_size.endsWith('%')) {
                return view ? view.layout_size : undefined;
            }
            if (!domElement) return view.layout_size;

            var containerWidth = domElement.clientWidth;
            var containerHeight = domElement.clientHeight;

            if (containerWidth <= 0 || containerHeight <= 0) {
                return view.layout_size;
            }

            var fraction = parseFloat(view.layout_size.replace('%', '')) / 100.0;
            var svgW = 1000;
            var svgH = 1000;

            if (view.svg_string) {
                var viewBoxMatch = view.svg_string.match(/viewBox\s*=\s*['"]([^'"]+)['"]/i);
                if (viewBoxMatch) {
                    var parts = viewBoxMatch[1].trim().split(/[\s,]+/);
                    if (parts.length >= 4) {
                        svgW = parseFloat(parts[2]);
                        svgH = parseFloat(parts[3]);
                    }
                } else {
                    var wMatch = view.svg_string.match(/width\s*=\s*['"]([^'"]+)['"]/i);
                    var hMatch = view.svg_string.match(/height\s*=\s*['"]([^'"]+)['"]/i);
                    if (wMatch && hMatch) {
                        var wVal = parseFloat(wMatch[1]);
                        var hVal = parseFloat(hMatch[1]);
                        if (!isNaN(wVal) && !isNaN(hVal)) {
                            svgW = wVal;
                            svgH = hVal;
                        }
                    }
                }
            }

            if (svgW <= 0 || svgH <= 0) return view.layout_size;

            var containerRatio = containerWidth / containerHeight;
            var svgRatio = svgW / svgH;
            var targetMaxPx;

            if (containerRatio < svgRatio) {
                var scale = (containerWidth * fraction) / svgW;
                targetMaxPx = Math.max(svgW, svgH) * scale;
            } else {
                var scale = (containerHeight * fraction) / svgH;
                targetMaxPx = Math.max(svgW, svgH) * scale;
            }

            return Math.round(targetMaxPx) + 'px';
        }

        Object.keys(viewsData).forEach(blockId => {
            const viewData = viewsData[blockId];
            const dom = document.getElementById('chart-' + blockId);

            if (dom) {
                const chart = echarts.init(dom, 'dark', { renderer: viewData.render_mode || 'canvas' });
                activeCharts[blockId] = chart;

                echarts.registerMap('sivoMap_' + blockId, { svg: viewData.svg_string });

                const option = {
                    backgroundColor: 'transparent',
                    tooltip: {
                        trigger: 'item',
                        className: 'echarts-tooltip'
                    },
                    geo: {
                        map: 'sivoMap_' + blockId,
                        roam: true,
                        layoutCenter: ['50%', '50%'],
                        layoutSize: calculateLayoutSize(viewData, dom),
                        regions: viewData.echarts_data
                    },
                    series: []
                };

                if (viewData.data_binding) {
                    option.series.push({
                        type: 'map',
                        map: 'sivoMap_' + blockId,
                        geoIndex: 0,
                        data: viewData.echarts_data
                    });

                    const db = viewData.data_binding;
                    option.visualMap = {
                        left: 'right',
                        bottom: '5%',
                        min: db.min_value,
                        max: db.max_value,
                        inRange: {
                            color: [db.min_color, db.max_color]
                        },
                        text: [db.max_label || 'High', db.min_label || 'Low'],
                        textStyle: { color: '#94a3b8' },
                        calculable: true,
                        formatter: function (value) {
                            if (db.legend_formatter === "currency") {
                                return '$' + Math.round(value).toLocaleString();
                            } else if (db.legend_formatter === "percent") {
                                return Math.round(value) + '%';
                            }
                            return Math.round(value);
                        }
                    };
                    if (db.legend_title) {
                        option.title = { text: db.legend_title, left: 'right', top: '10px', textStyle: {fontSize: 12, color: '#94a3b8'} };
                    }
                }

                chart.setOption(option);
            }
        });

        function updateChartLayoutSizes() {
            Object.keys(activeCharts).forEach(blockId => {
                const chart = activeCharts[blockId];
                const viewData = viewsData[blockId];
                const dom = document.getElementById('chart-' + blockId);

                if (chart && viewData && dom) {
                    const newSize = calculateLayoutSize(viewData, dom);
                    chart.setOption({
                        geo: { layoutSize: newSize, layoutCenter: ['50%', '50%'] }
                    });
                    chart.resize();
                }
            });
        }

        window.addEventListener('resize', () => {
            updateChartLayoutSizes();
        });

        const detailsPanels = document.querySelectorAll('.sivo-details-panel');
        const metricsPanels = document.querySelectorAll('.sivo-metrics-panel');

        Object.keys(activeCharts).forEach(chartId => {
            const chart = activeCharts[chartId];
            chart.on('click', function(params) {
                if(!params.name) return;

                const viewData = viewsData[chartId];
                const elementActions = viewData.actions_manifest[params.name];

                let tooltipContent = null;
                let payloadData = null;
                let panelPosition = "none";

                if (elementActions && elementActions.length > 0) {
                    const tooltipActionForPos = elementActions.find(a => a.action_type === 'tooltip');
                    if (tooltipActionForPos && tooltipActionForPos.panel_position) {
                        panelPosition = tooltipActionForPos.panel_position;
                    }

                    elementActions.forEach(action => {
                        if (action.action_type === 'url' && action.url) {
                            if (action.target === '_blank') {
                                window.open(action.url, '_blank');
                            } else {
                                window.location.href = action.url;
                            }
                        } else if (action.action_type === 'drilldown' && action.target_svg) {
                            console.warn("Dashboard Drilldown triggered to:", action.target_svg);
                        }
                    });

                    const tooltipAction = elementActions.find(a => a.action_type === 'tooltip');
                    if (tooltipAction && tooltipAction.content) {
                        tooltipContent = tooltipAction.content;
                    }

                    const payloadAction = elementActions.find(a => a.action_type === 'callback' || a.payload !== undefined);
                    if (payloadAction && payloadAction.payload) {
                        payloadData = payloadAction.payload;
                    }
                }

                if ((panelPosition === 'right' || panelPosition === 'overlay') && tooltipContent) {
                    document.getElementById('sidebar-title').innerText = params.name;
                    document.getElementById('sidebar-content').innerHTML = tooltipContent;
                    document.getElementById('sivo-sliding-sidebar').classList.add('active');

                    detailsPanels.forEach(panel => {
                        const container = panel.querySelector('.sivo-details-content');
                        container.innerHTML = `<h3 style="margin-top:0; color:#f8fafc;">${params.name}</h3><p style="color: #94a3b8; font-style: italic;">Details opened in sidebar overlay.</p>`;
                    });
                } else {
                    detailsPanels.forEach(panel => {
                        const container = panel.querySelector('.sivo-details-content');
                        if (tooltipContent) {
                            container.innerHTML = `<h3 style="margin-top:0; color:#f8fafc;">${params.name}</h3>${tooltipContent}`;
                        } else {
                            container.innerHTML = `<h3 style="margin-top:0; color:#f8fafc;">${params.name}</h3><p style="color: #94a3b8;">No additional details mapped.</p>`;
                        }
                    });
                }

                metricsPanels.forEach(panel => {
                    const valueSpans = panel.querySelectorAll('.metric-value');
                    valueSpans.forEach(span => {
                        const key = span.getAttribute('data-metric-key');
                        if (payloadData && payloadData[key] !== undefined) {
                            span.innerText = payloadData[key];
                        } else {
                            span.innerText = '---';
                        }
                    });
                });
            });
        });

        function closeSidebar() {
            document.getElementById('sivo-sliding-sidebar').classList.remove('active');
        }


    </script>
