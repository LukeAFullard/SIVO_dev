<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Sprint Board</title>

    <!-- Include ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        :root {
            --bg-color: #e2e8f0;
            --lane-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --primary-color: #2563eb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 2.5rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
            overflow-x: auto;
            align-items: start;
        }

        .kanban-lane {
            background-color: var(--lane-bg);
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid var(--border-color);
            min-width: 300px;
        }

        .lane-header {
            font-weight: 600;
            font-size: 1.125rem;
            color: var(--text-color);
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 0.5rem;
        }

        .sivo-card, .html-card {
            background-color: var(--card-bg);
            border-radius: 0.375rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .sivo-card:hover, .html-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .sivo-container {
            width: 100%;
            height: 300px; /* Fixed height for kanban cards */
            position: relative;
        }

        .sivo-native-overlay-svg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .card-header {
            padding: 0.75rem 1rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-content {
            padding: 1rem;
        }

        /* Metrics Panel Styling */
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Sidebar Implementation */
        #sivo-sliding-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background-color: var(--card-bg);
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease-in-out;
            z-index: 9999;
            display: flex;
            flex-direction: column;
        }

        #sivo-sliding-sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8fafc;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: #0f172a;
        }

        .sidebar-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
        }

        .sidebar-content {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
            line-height: 1.6;
        }

        /* Group blocks by their assigned 'slot' string which acts as the lane name */
    </style>
</head>
<body>

    <header>
        <h1>Project Sprint Board</h1>
    </header>

    <div class="dashboard-container" id="dashboard-container">
        <!-- We will generate a lane for each column/slot -->


















        <div class="kanban-lane" id="lane-to_do">
            <div class="lane-header">To Do</div>



                <div class="sivo-card" id="card-task_api">
                    <div class="card-header">Task Api</div>
                    <div class="sivo-container" id="container-task_api">
                        <div id="chart-task_api" style="width: 100%; height: 100%;"></div>
                        <div id="overlay-task_api" class="sivo-native-overlay-svg-container"></div>
                    </div>
                </div>



                <div class="sivo-card" id="card-task_db">
                    <div class="card-header">Task Db</div>
                    <div class="sivo-container" id="container-task_db">
                        <div id="chart-task_db" style="width: 100%; height: 100%;"></div>
                        <div id="overlay-task_db" class="sivo-native-overlay-svg-container"></div>
                    </div>
                </div>


        </div>

        <div class="kanban-lane" id="lane-in_progress">
            <div class="lane-header">In Progress</div>



                <div class="sivo-card" id="card-task_auth">
                    <div class="card-header">Task Auth</div>
                    <div class="sivo-container" id="container-task_auth">
                        <div id="chart-task_auth" style="width: 100%; height: 100%;"></div>
                        <div id="overlay-task_auth" class="sivo-native-overlay-svg-container"></div>
                    </div>
                </div>


        </div>

        <div class="kanban-lane" id="lane-done">
            <div class="lane-header">Done</div>



                <div class="sivo-card" id="card-task_deploy">
                    <div class="card-header">Task Deploy</div>
                    <div class="sivo-container" id="container-task_deploy">
                        <div id="chart-task_deploy" style="width: 100%; height: 100%;"></div>
                        <div id="overlay-task_deploy" class="sivo-native-overlay-svg-container"></div>
                    </div>
                </div>


        </div>

    </div>

    <!-- Global Sliding Sidebar Overlay -->
    <div id="sivo-sliding-sidebar">
        <div class="sidebar-header">
            <h2 id="sidebar-title">Details</h2>
            <button class="sidebar-close-btn" onclick="closeSidebar()" title="Close">&times;</button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Dynamic content injected here -->
        </div>
    </div>

        const activeCharts = {};

        function calculateLayoutSize(view, domElement) {
            if (!view || !view.layout_size || typeof view.layout_size !== 'string' || !view.layout_size.endsWith('%')) {
                return view ? view.layout_size : undefined;
            }
            if (!domElement) return view.layout_size;

            var containerWidth = domElement.clientWidth;
            var containerHeight = domElement.clientHeight;
            var layoutRatio = view.layout_size ? parseFloat(view.layout_size.replace('%', '')) / 100 : 0.95;

            var svgWidth = view.metadata && view.metadata.viewBox ? parseFloat(view.metadata.viewBox.split(' ')[2]) : 1000;
            var svgHeight = view.metadata && view.metadata.viewBox ? parseFloat(view.metadata.viewBox.split(' ')[3]) : 1000;
            var svgAspect = svgWidth / svgHeight;
            var containerAspect = containerWidth / containerHeight;

            var finalSize;
            if (containerAspect > svgAspect) {
                finalSize = Math.floor(containerHeight * layoutRatio);
            } else {
                finalSize = Math.floor(containerWidth * layoutRatio);
            }
            return finalSize + 'px';
        }

                if (!document.getElementById('chart-' + blockId)) continue;

                echarts.registerMap('sivoMap_' + blockId, { svg: viewData.svg_string });

                const chart = echarts.init(document.getElementById('chart-' + blockId), null, { renderer: viewData.render_mode || 'canvas' });
                activeCharts[blockId] = chart;

                const dom = document.getElementById('chart-' + blockId);
                const calcSize = calculateLayoutSize(viewData, dom);

                const option = {
                    tooltip: {},
                    geo: {
                        map: 'sivoMap_' + blockId,
                        roam: true,
                        layoutCenter: ['50%', '50%'],
                        layoutSize: calcSize,
                        itemStyle: { color: 'transparent' },
                        emphasis: { itemStyle: { color: 'transparent' }, label: { show: false } },
                        regions: viewData.echarts_data
                    },
                    series: []
                };

                if (viewData.data_binding) {
                    option.series.push({
                        type: 'map',
                        map: 'sivoMap_' + blockId,
                        geoIndex: 0,
                        data: viewData.echarts_data
                    });

                    const db = viewData.data_binding;
                    option.visualMap = {
                        left: 'right',
                        bottom: '5%',
                        min: db.min_value,
                        max: db.max_value,
                        inRange: {
                            color: [db.min_color, db.max_color]
                        },
                        text: [db.max_label || 'High', db.min_label || 'Low'],
                        calculable: true,
                        formatter: function (value) {
                            if (db.legend_formatter === "currency") {
                                return '$' + Math.round(value).toLocaleString();
                            } else if (db.legend_formatter === "percent") {
                                return Math.round(value) + '%';
                            }
                            return Math.round(value);
                        }
                    };
                    if (db.legend_title) {
                        option.title = { text: db.legend_title, left: 'right', top: '10px', textStyle: {fontSize: 12, color: '#64748b', fontWeight: 'bold', textTransform: 'uppercase'} };
                    }
                }

                chart.setOption(option);
            }

            // Interaction bindings
            const detailsPanels = document.querySelectorAll('.sivo-details-panel');
            const metricsPanels = document.querySelectorAll('.sivo-metrics-panel');

            Object.keys(activeCharts).forEach(chartId => {
                const chart = activeCharts[chartId];
                chart.on('click', function(params) {
                    if(!params.name) return;

                    const viewData = viewsData[chartId];
                    const elementActions = viewData.actions_manifest[params.name];

                    let tooltipContent = null;
                    let payloadData = null;
                    let panelPosition = "none";

                    if (elementActions && elementActions.length > 0) {
                        const tooltipActionForPos = elementActions.find(a => a.action_type === 'tooltip');
                        if (tooltipActionForPos && tooltipActionForPos.panel_position) {
                            panelPosition = tooltipActionForPos.panel_position;
                        }

                        elementActions.forEach(action => {
                            if (action.action_type === 'url' && action.url) {
                                if (action.target === '_blank') {
                                    window.open(action.url, '_blank');
                                } else {
                                    window.location.href = action.url;
                                }
                            }
                        });

                        const tooltipAction = elementActions.find(a => a.action_type === 'tooltip');
                        if (tooltipAction && tooltipAction.content) {
                            tooltipContent = tooltipAction.content;
                        }

                        const payloadAction = elementActions.find(a => a.action_type === 'callback' || a.payload !== undefined);
                        if (payloadAction && payloadAction.payload) {
                            payloadData = payloadAction.payload;
                        }
                    }

                    if ((panelPosition === 'right' || panelPosition === 'overlay') && tooltipContent) {
                        document.getElementById('sidebar-title').innerText = params.name;
                        document.getElementById('sidebar-content').innerHTML = tooltipContent;
                        document.getElementById('sivo-sliding-sidebar').classList.add('active');
                    } else {
                        detailsPanels.forEach(panel => {
                            const container = panel.querySelector('.sivo-details-content');
                            if (tooltipContent) {
                                container.innerHTML = `<h3 style="margin-top:0; color:var(--text-color);">${params.name}</h3>${tooltipContent}`;
                            } else {
                                container.innerHTML = `<h3 style="margin-top:0; color:var(--text-color);">${params.name}</h3><p style="color: var(--text-muted);">No additional details mapped.</p>`;
                            }
                        });
                    }

                    metricsPanels.forEach(panel => {
                        const valueSpans = panel.querySelectorAll('.metric-value');
                        valueSpans.forEach(span => {
                            const key = span.getAttribute('data-metric-key');
                            if (payloadData && payloadData[key] !== undefined) {
                                span.innerText = payloadData[key];
                            } else {
                                span.innerText = '---';
                            }
                        });
                    });
                });
            });

            // Handle resizing
            window.addEventListener('resize', () => {
                Object.keys(activeCharts).forEach(blockId => {
                    const chart = activeCharts[blockId];
                    const viewData = viewsData[blockId];
                    const dom = document.getElementById('chart-' + blockId);
                    if (chart && viewData && dom) {
                        const newSize = calculateLayoutSize(viewData, dom);
                        chart.setOption({
                            geo: { layoutSize: newSize, layoutCenter: ['50%', '50%'] }
                        });
                        chart.resize();
                    }
                });
            });
        });

        function closeSidebar() {
            document.getElementById('sivo-sliding-sidebar').classList.remove('active');
        }


    </script>
</body>
</html>
