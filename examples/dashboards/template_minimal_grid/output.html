<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Operations</title>

    <!-- Include ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-color: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --primary-color: #000000;
            --accent-color: #4f46e5;
            --shadow-subtle: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem 3rem 1rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin: 0;
            font-size: 1.875rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        p.subtitle {
            margin: 0.25rem 0 0 0;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2rem;
            padding: 2rem 3rem;
            flex: 1;
        }

        .minimal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .minimal-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .sivo-card {
            min-height: 350px;
        }

        .sivo-container {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .sivo-native-overlay-svg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .card-header {
            padding: 1rem 1.5rem;
            font-weight: 700;
            font-size: 0.875rem;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .card-content {
            padding: 1.5rem;
            flex: 1;
            overflow-y: auto;
        }

        /* Metrics special styling */
        .sivo-metrics-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }

        .metric-item {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .metric-val {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        /* Sliding Sidebar Implementation for specific blocks */
        #sivo-sliding-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 400px;
            max-width: 100vw;
            height: 100vh;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            display: flex;
            flex-direction: column;
        }

        #sivo-sliding-sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f9fafb;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sidebar-close-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .sidebar-close-btn:hover {
            color: var(--primary-color);
        }

        .sidebar-content {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            header {
                padding: 1.5rem 1rem;
                flex-direction: column;
                align-items: flex-start;
            }
            .minimal-card {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>System Operations</h1>
            <p class="subtitle">Minimal Grid Interface</p>
        </div>
        <div class="header-status" style="font-size: 0.875rem; color: var(--text-muted); font-weight: 500;">
            <span style="display:inline-block; width:8px; height:8px; background-color:#10b981; border-radius:50%; margin-right:0.5rem;"></span>System Normal
        </div>
    </header>

    <div class="dashboard-container" id="dashboard-container">


            <div class="minimal-card sivo-metrics-panel" id="card-system_metrics" data-block-id="system_metrics" style="grid-column: span 4;">
                <div class="card-header">Live Telemetry</div>
                <div class="card-content sivo-metrics-content" id="container-system_metrics">

                    <div class="metric-item">
                        <span class="metric-label">cpu load</span>
                        <span class="metric-value metric-val" data-metric-key="cpu_load">---</span>
                    </div>

                    <div class="metric-item">
                        <span class="metric-label">memory usage</span>
                        <span class="metric-value metric-val" data-metric-key="memory_usage">---</span>
                    </div>

                    <div class="metric-item">
                        <span class="metric-label">network io</span>
                        <span class="metric-value metric-val" data-metric-key="network_io">---</span>
                    </div>

                    <div class="metric-item">
                        <span class="metric-label">active connections</span>
                        <span class="metric-value metric-val" data-metric-key="active_connections">---</span>
                    </div>

                </div>
            </div>



            <div class="minimal-card sivo-card" id="card-cluster_topology" style="grid-column: span 3;">
                <div class="card-header">Cluster Topology</div>
                <div class="sivo-container" id="container-cluster_topology">
                    <div id="chart-cluster_topology" style="width: 100%; height: 100%;"></div>
                    <div id="overlay-cluster_topology" class="sivo-native-overlay-svg-container"></div>
                </div>
            </div>



            <div class="minimal-card sivo-details-panel" id="card-node_details" data-block-id="node_details" style="grid-column: span 1;">
                <div class="card-header">Cluster Logs</div>
                <div class="card-content sivo-details-content" id="container-node_details">
                    <div class="placeholder-content" style="display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-style: italic; text-align: center;">
                        <p>Select a cluster quadrant to view active logs and status.</p>
                    </div>
                </div>
            </div>


    </div>

    <!-- Global Sliding Sidebar Overlay -->
    <div id="sivo-sliding-sidebar">
        <div class="sidebar-header">
            <h2 id="sidebar-title">Details</h2>
            <button class="sidebar-close-btn" onclick="closeSidebar()" title="Close">&times;</button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Dynamic content injected here -->
        </div>
    </div>

        const activeCharts = {};

        function calculateLayoutSize(view, domElement) {
            if (!view || !view.layout_size || typeof view.layout_size !== 'string' || !view.layout_size.endsWith('%')) {
                return view ? view.layout_size : undefined;
            }
            if (!domElement) return view.layout_size;

            var containerWidth = domElement.clientWidth;
            var containerHeight = domElement.clientHeight;

            if (containerWidth <= 0 || containerHeight <= 0) {
                return view.layout_size;
            }

            var fraction = parseFloat(view.layout_size.replace('%', '')) / 100.0;
            var svgW = 1000;
            var svgH = 1000;

            if (view.svg_string) {
                var viewBoxMatch = view.svg_string.match(/viewBox\s*=\s*['"]([^'"]+)['"]/i);
                if (viewBoxMatch) {
                    var parts = viewBoxMatch[1].trim().split(/[\s,]+/);
                    if (parts.length >= 4) {
                        svgW = parseFloat(parts[2]);
                        svgH = parseFloat(parts[3]);
                    }
                } else {
                    var wMatch = view.svg_string.match(/width\s*=\s*['"]([^'"]+)['"]/i);
                    var hMatch = view.svg_string.match(/height\s*=\s*['"]([^'"]+)['"]/i);
                    if (wMatch && hMatch) {
                        var wVal = parseFloat(wMatch[1]);
                        var hVal = parseFloat(hMatch[1]);
                        if (!isNaN(wVal) && !isNaN(hVal)) {
                            svgW = wVal;
                            svgH = hVal;
                        }
                    }
                }

            if (svgW <= 0 || svgH <= 0) return view.layout_size;

            var containerRatio = containerWidth / containerHeight;
            var svgRatio = svgW / svgH;

                        bottom: '5%',
                        min: db.min_value,
                        max: db.max_value,
                        inRange: {
                            color: [db.min_color, db.max_color]
                        },
                        text: [db.max_label || 'High', db.min_label || 'Low'],
                        calculable: true,
                        formatter: function (value) {
                            if (db.legend_formatter === "currency") {
                                return '$' + Math.round(value).toLocaleString();
                            } else if (db.legend_formatter === "percent") {
                                return Math.round(value) + '%';
                            }
                            return Math.round(value);
                        }
                    };
                    if (db.legend_title) {
                        option.title = { text: db.legend_title, left: 'right', top: '10px', textStyle: {fontSize: 12, color: '#6b7280', fontWeight: 'bold', textTransform: 'uppercase'} };
                    }
                }

                chart.setOption(option);
            }
        });

        function updateChartLayoutSizes() {
            Object.keys(activeCharts).forEach(blockId => {
                const chart = activeCharts[blockId];
                const viewData = viewsData[blockId];
                const dom = document.getElementById('chart-' + blockId);

                if (chart && viewData && dom) {
                    const newSize = calculateLayoutSize(viewData, dom);
                    chart.setOption({
                        geo: { layoutSize: newSize, layoutCenter: ['50%', '50%'] }
                    });
                    chart.resize();
                }
            });
        }

        window.addEventListener('resize', () => {
            updateChartLayoutSizes();
        });

        const detailsPanels = document.querySelectorAll('.sivo-details-panel');
        const metricsPanels = document.querySelectorAll('.sivo-metrics-panel');

        Object.keys(activeCharts).forEach(chartId => {
            const chart = activeCharts[chartId];
            chart.on('click', function(params) {
                if(!params.name) return;

                const viewData = viewsData[chartId];
                const elementActions = viewData.actions_manifest[params.name];

                let tooltipContent = null;
                let payloadData = null;
                let panelPosition = "none";

                if (elementActions && elementActions.length > 0) {
                    const tooltipActionForPos = elementActions.find(a => a.action_type === 'tooltip');
                    if (tooltipActionForPos && tooltipActionForPos.panel_position) {
                        panelPosition = tooltipActionForPos.panel_position;
                    }

                    elementActions.forEach(action => {
                        if (action.action_type === 'url' && action.url) {
                            if (action.target === '_blank') {
                                window.open(action.url, '_blank');
                            } else {
                                window.location.href = action.url;
                            }
                        } else if (action.action_type === 'drilldown' && action.target_svg) {
                            console.warn("Dashboard Drilldown triggered to:", action.target_svg);
                        }
                    });

                    const tooltipAction = elementActions.find(a => a.action_type === 'tooltip');
                    if (tooltipAction && tooltipAction.content) {
                        tooltipContent = tooltipAction.content;
                    }

                    const payloadAction = elementActions.find(a => a.action_type === 'callback' || a.payload !== undefined);
                    if (payloadAction && payloadAction.payload) {
                        payloadData = payloadAction.payload;
                    }
                }

                if ((panelPosition === 'right' || panelPosition === 'overlay') && tooltipContent) {
                    document.getElementById('sidebar-title').innerText = params.name;
                    document.getElementById('sidebar-content').innerHTML = tooltipContent;
                    document.getElementById('sivo-sliding-sidebar').classList.add('active');

                    detailsPanels.forEach(panel => {
                        const container = panel.querySelector('.sivo-details-content');
                        container.innerHTML = `<h3 style="margin-top:0; color:var(--text-color);">${params.name}</h3><p style="color: var(--text-muted); font-style: italic;">Details opened in sidebar overlay.</p>`;
                    });
                } else {
                    detailsPanels.forEach(panel => {
                        const container = panel.querySelector('.sivo-details-content');
                        if (tooltipContent) {
                            container.innerHTML = `<h3 style="margin-top:0; color:var(--text-color);">${params.name}</h3>${tooltipContent}`;
                        } else {
                            container.innerHTML = `<h3 style="margin-top:0; color:var(--text-color);">${params.name}</h3><p style="color: var(--text-muted);">No additional details mapped.</p>`;
                        }
                    });
                }

                metricsPanels.forEach(panel => {
                    const valueSpans = panel.querySelectorAll('.metric-value');
                    valueSpans.forEach(span => {
                        const key = span.getAttribute('data-metric-key');
                        if (payloadData && payloadData[key] !== undefined) {
                            span.innerText = payloadData[key];
                        } else {
                            span.innerText = '---';
                        }
                    });
                });
            });
        });

        function closeSidebar() {
            document.getElementById('sivo-sliding-sidebar').classList.remove('active');
        }


    </script>
</body>
</html>
