<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations Overview</title>

    <!-- Include ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: transparent;
            --primary-color: #3b82f6;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem 2.5rem 0.5rem 2.5rem;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            margin: 0.5rem 0 0 0;
            color: #64748b;
            font-size: 1.125rem;
        }

        .dashboard-container {
            display: grid;
            /* Auto-fit bento box grid layout */
            grid-template-columns: repeat(3, minmax(0, 1fr));
            /* Ensure nice row heights if we want true bento */
            grid-auto-rows: minmax(250px, auto);
            gap: 1.5rem;
            padding: 1.5rem 2.5rem 2.5rem 2.5rem;
            flex: 1;
        }

        .sivo-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .sivo-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .html-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .html-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .sivo-container {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .sivo-native-overlay-svg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .card-header {
            padding: 1.25rem 1.5rem 0.5rem 1.5rem;
            font-weight: 600;
            font-size: 1.125rem;
            color: #1e293b;
            background: transparent;
            z-index: 20;
            pointer-events: none;
        }

        .card-content {
            padding: 1rem 1.5rem 1.5rem 1.5rem;
            flex: 1;
            overflow-y: auto;
        }

        /* Metrics special styling for bento box */
        .sivo-metrics-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            gap: 1rem !important;
        }

        .metric-row {
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            padding: 1rem;
            border-radius: var(--radius-lg);
            border: 1px solid #e2e8f0;
        }

        .metric-label {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-val {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
            margin-top: 0.25rem;
        }

        /* Sliding Sidebar Implementation for specific blocks */
        #sivo-sliding-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 450px;
            max-width: 100vw;
            height: 100vh;
            background-color: var(--card-bg);
            box-shadow: -10px 0 25px rgba(0,0,0,0.1);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        #sivo-sliding-sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .sidebar-close-btn {
            background: #f1f5f9;
            border: none;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .sidebar-close-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .sidebar-content {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            header {
                padding: 1.5rem 1rem 0.5rem 1rem;
            }
            .sivo-card, .html-card, .sivo-details-panel, .sivo-metrics-panel {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Operations Overview</h1>
        <p class="subtitle">Bento Box Dashboard</p>
    </header>

    <div class="dashboard-container" id="dashboard-container">


            <div class="html-card" id="card-header_info" style="grid-column: span 3;">
                <div class="card-content" id="container-header_info">

    <div style="text-align: center; padding: 20px;">
        <h2 style="margin: 0; color: #1e293b; font-size: 1.5rem;">Global Infrastructure Status</h2>
        <p style="color: #64748b; margin-top: 10px;">Live monitoring of regional data centers and active server nodes.</p>
    </div>

                </div>
            </div>



            <div class="sivo-card" id="card-regional_map" style="grid-column: span 2;">
                <div class="card-header">Regional Map</div>
                <div class="sivo-container" id="container-regional_map">
                    <div id="chart-regional_map" style="width: 100%; height: 100%;"></div>
                    <div id="overlay-regional_map" class="sivo-native-overlay-svg-container"></div>
                </div>
            </div>



            <div class="sivo-card" id="card-eu_operations" style="grid-column: span 1;">
                <div class="card-header">Eu Operations</div>
                <div class="sivo-container" id="container-eu_operations">
                    <div id="chart-eu_operations" style="width: 100%; height: 100%;"></div>
                    <div id="overlay-eu_operations" class="sivo-native-overlay-svg-container"></div>
                </div>
            </div>



            <div class="html-card sivo-details-panel" id="card-hub_details" data-block-id="hub_details" style="grid-column: span 2;">
                <div class="card-header">Node Details</div>
                <div class="card-content sivo-details-content" id="container-hub_details">
                    <div class="placeholder-content" style="display: flex; align-items: center; justify-content: center; height: 100%; color: #94a3b8; font-style: italic; text-align: center;">
                        <p>Click a state on the map to view regional hub details.</p>
                    </div>
                </div>
            </div>



            <div class="html-card sivo-metrics-panel" id="card-performance_metrics" data-block-id="performance_metrics" style="grid-column: span 1;">
                <div class="card-header">Live Metrics</div>
                <div class="card-content sivo-metrics-content" id="container-performance_metrics">

                    <div class="metric-row">
                        <span class="metric-label">Active Nodes</span>
                        <span class="metric-value metric-val" data-metric-key="active_nodes">---</span>
                    </div>

                    <div class="metric-row">
                        <span class="metric-label">Latency</span>
                        <span class="metric-value metric-val" data-metric-key="latency">---</span>
                    </div>

                    <div class="metric-row">
                        <span class="metric-label">Uptime</span>
                        <span class="metric-value metric-val" data-metric-key="uptime">---</span>
                    </div>

                </div>
            </div>


    </div>

    <!-- Global Sliding Sidebar Overlay -->
    <div id="sivo-sliding-sidebar">
        <div class="sidebar-header">
            <h2 id="sidebar-title">Details</h2>
            <button class="sidebar-close-btn" onclick="closeSidebar()" title="Close">&times;</button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Dynamic content injected here -->
        </div>
    </div>

                        layoutCenter: ['50%', '50%'],
                        layoutSize: calculateLayoutSize(viewData, dom),
                        regions: viewData.echarts_data // Apply colors directly to SVG regions via geo
                    },
                    series: []
                };

                // Add visualMap for choropleths if data_binding exists
                if (viewData.data_binding) {
                    option.series.push({
                        type: 'map',
                        map: 'sivoMap_' + blockId,
                        geoIndex: 0,
                        data: viewData.echarts_data
                    });

                    const db = viewData.data_binding;
                    option.visualMap = {
                        left: 'right',
                        bottom: '5%',
                        min: db.min_value,
                        max: db.max_value,
                        inRange: {
                            color: [db.min_color, db.max_color]
                        },
                        text: [db.max_label || 'High', db.min_label || 'Low'],
                        calculable: true,
                        formatter: function (value) {
                            if (db.legend_formatter === "currency") {
                                return '$' + Math.round(value).toLocaleString();
                            } else if (db.legend_formatter === "percent") {
                                return Math.round(value) + '%';
                            }
                            return Math.round(value);
                        }
                    };
                    if (db.legend_title) {
                        option.title = { text: db.legend_title, left: 'right', top: '10px', textStyle: {fontSize: 12, color: '#64748b'} };
                    }
                }

                chart.setOption(option);
            }
        });

        function updateChartLayoutSizes() {
            Object.keys(activeCharts).forEach(blockId => {
                const chart = activeCharts[blockId];
                const viewData = viewsData[blockId];
                const dom = document.getElementById('chart-' + blockId);

                if (chart && viewData && dom) {
                    const newSize = calculateLayoutSize(viewData, dom);
                    chart.setOption({
                        geo: { layoutSize: newSize, layoutCenter: ['50%', '50%'] }
                    });
                    chart.resize();
                }
            });
        }

        // Handle Window Resize for all blocks
        window.addEventListener('resize', () => {
            updateChartLayoutSizes();
        });

        // Automatic cross-block communication setup
        const detailsPanels = document.querySelectorAll('.sivo-details-panel');
        const metricsPanels = document.querySelectorAll('.sivo-metrics-panel');

        Object.keys(activeCharts).forEach(chartId => {
            const chart = activeCharts[chartId];
            chart.on('click', function(params) {
                if(!params.name) return;

                const viewData = viewsData[chartId];
                const elementActions = viewData.actions_manifest[params.name];

                let tooltipContent = null;
                let payloadData = null;

                let panelPosition = "none";

                if (elementActions && elementActions.length > 0) {
                    const tooltipActionForPos = elementActions.find(a => a.action_type === 'tooltip');
                    if (tooltipActionForPos && tooltipActionForPos.panel_position) {
                        panelPosition = tooltipActionForPos.panel_position;
                    }

                    elementActions.forEach(action => {
                        if (action.action_type === 'url' && action.url) {
                            if (action.target === '_blank') {
                                window.open(action.url, '_blank');
                            } else {
                                window.location.href = action.url;
                            }
                        } else if (action.action_type === 'drilldown' && action.target_svg) {
                            console.warn("Dashboard Drilldown triggered to:", action.target_svg);
                        }
                    });

                    const tooltipAction = elementActions.find(a => a.action_type === 'tooltip');
                    if (tooltipAction && tooltipAction.content) {
                        tooltipContent = tooltipAction.content;
                    }

                    const payloadAction = elementActions.find(a => a.action_type === 'callback' || a.payload !== undefined);
                    if (payloadAction && payloadAction.payload) {
                        payloadData = payloadAction.payload;
                    }
                }

                if ((panelPosition === 'right' || panelPosition === 'overlay') && tooltipContent) {
                    document.getElementById('sidebar-title').innerText = params.name;
                    document.getElementById('sidebar-content').innerHTML = tooltipContent;
                    document.getElementById('sivo-sliding-sidebar').classList.add('active');

                    detailsPanels.forEach(panel => {
                        const container = panel.querySelector('.sivo-details-content');
                        container.innerHTML = `<h3 style="margin-top:0;">${params.name}</h3><p style="color: #64748b; font-style: italic;">Details opened in sidebar overlay.</p>`;
                    });
                } else {
                    detailsPanels.forEach(panel => {
                        const container = panel.querySelector('.sivo-details-content');
                        if (tooltipContent) {
                            container.innerHTML = `<h3 style="margin-top:0;">${params.name}</h3>${tooltipContent}`;
                        } else {
                            container.innerHTML = `<h3 style="margin-top:0;">${params.name}</h3><p style="color: #64748b;">No additional details mapped.</p>`;
                        }
                    });
                }

                metricsPanels.forEach(panel => {
                    const valueSpans = panel.querySelectorAll('.metric-value');
                    valueSpans.forEach(span => {
                        const key = span.getAttribute('data-metric-key');
                        if (payloadData && payloadData[key] !== undefined) {
                            span.innerText = payloadData[key];
                        } else {
                            span.innerText = '---';
                        }
                    });
                });
            });
        });

        function closeSidebar() {
            document.getElementById('sivo-sliding-sidebar').classList.remove('active');
        }


    </script>
</body>
</html>
