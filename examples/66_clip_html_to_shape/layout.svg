<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Content Container -->
  <g transform="translate(50, 50)">

    <!-- Title Text -->
    <text x="0" y="30" font-family="sans-serif" font-size="32" font-weight="bold" fill="#1e293b">Folium Map Integration</text>
    <text x="0" y="60" font-family="sans-serif" font-size="16" fill="#64748b">An example of mapping generic HTML (Folium) directly to a complex SVG shape.</text>

    <!-- The complex shape we want to embed the map into -->
    <!-- We will use a rounded rectangle with one clipped corner -->
    <path id="map_container"
          d="M 20 120 L 680 120 A 20 20 0 0 1 700 140 L 700 480 A 20 20 0 0 1 680 500 L 120 500 L 20 400 Z"
          fill="#e2e8f0"
          stroke="#94a3b8"
          stroke-width="2" />

    <!-- Decorative Elements over the map container -->
    <circle cx="20" cy="120" r="8" fill="#ef4444" />
    <circle cx="700" cy="120" r="8" fill="#3b82f6" />

    <text id="hover_info" x="350" y="310" font-family="sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">Map loading...</text>
  </g>
</svg>
