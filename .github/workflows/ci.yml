name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-playwright pytest-cov flake8 ruff mypy pip-audit lxml-stubs types-requests types-MarkupSafe types-setuptools types-urllib3
        playwright install chromium

    - name: Install Node dependencies
      run: npm ci

    - name: Security Scan (Python)
      run: pip-audit

    - name: Security Scan (Node)
      run: npm audit || true

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check with Ruff
      run: ruff check src

    - name: Type check with MyPy
      run: mypy src/sivo

    - name: Run Tests
      run: PYTHONPATH=src pytest --cov=src --cov-report=term-missing
