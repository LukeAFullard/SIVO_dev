[project]
name = "sivo"
version = "0.1.0"
description = "SIVO: Serverless Interactive Vector Objects"
authors = [
    {name = "SIVO Contributors",email = "email@example.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "lxml (>=6.0.4)",
    "jinja2 (>=3.1.0)",
    "pydantic (>=2.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=7.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-playwright (>=0.4.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "ruff (>=0.15.10,<0.16.0)",
    "mypy (>=1.0.0)"
]
docs = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
